oteBorderColor      #B8B8B0</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="276" x="5" y="386.2904">skinparam NoteFontColor        #2D2D2D</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="223" x="5" y="405.3583">skinparam NoteFontSize         11</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="424.4263"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="311" x="5" y="443.4942">skinparam LegendBackgroundColor #F7F7F2</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="293" x="5" y="462.5621">skinparam LegendBorderColor     #B8B8B0</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="289" x="5" y="481.63">skinparam LegendFontColor       #2D2D2D</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="236" x="5" y="500.6979">skinparam LegendFontSize        10</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="519.7658"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="257" x="5" y="538.8338">skinparam StereotypeFontSize       10</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="277" x="5" y="557.9017">skinparam StereotypeFontStyle      italic</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="304" x="5" y="576.9696">skinparam StereotypeFontColor      #6E6E6E</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="596.0375"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="615.1054"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="402" x="5" y="634.1733">!unquoted procedure UML_NOTE_INFO($id, $target, $text)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="93" x="9" y="653.2413">Syntax Error?</text><!--MD5=[fca5a3fab88ef411a31673fddcba6e26]
@startuml
title Service Load Balancing Architecture - Built-in Load Balancer








skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam class {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  HeaderBackgroundColor #1F3B73
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
  RoundCorner       6
}

skinparam object {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
}

skinparam component {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam interface {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
}

skinparam node {
  BackgroundColor   #ECEEE8
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam package {
  BackgroundColor   #ECEEE8
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  Style             rectangle
}

skinparam rectangle {
  BackgroundColor   #F7F7F2
  BorderColor       #B8B8B0
  FontColor         #2D2D2D
}


!unquoted procedure STRUCT_GENERALIZATION($child, $parent)
$child - -|> $parent
!endprocedure

!unquoted procedure STRUCT_REALIZATION($class, $iface)
$class ..|> $iface
!endprocedure

!unquoted procedure STRUCT_DEPENDENCY($client, $supplier, $label="")
$client ..> $supplier : $label
!endprocedure

!unquoted procedure STRUCT_ASSOCIATION($a, $b, $label="")
$a - - $b : $label
!endprocedure

!unquoted procedure STRUCT_NAVIGABLE($a, $b, $label="")
$a - -> $b : $label
!endprocedure

!unquoted procedure STRUCT_AGGREGATION($whole, $part, $label="")
$whole o- - $part : $label
!endprocedure

!unquoted procedure STRUCT_COMPOSITION($whole, $part, $label="")
$whole *- - $part : $label
!endprocedure







!unquoted procedure STRUCT_LAYOUT_LR()
left to right direction
!endprocedure

!unquoted procedure STRUCT_LAYOUT_TB()
top to bottom direction
!endprocedure





skinparam node {
  RoundCorner 4
}
skinparam artifact {
  BackgroundColor #F7F7F2
  BorderColor     #4A6FA5
  FontColor       #2D2D2D
}

!unquoted procedure DEPLOY_DEVICE($name, $label)
node "$label" as $name <<device>>
!endprocedure

!unquoted procedure DEPLOY_EXECENV($name, $label)
node "$label" as $name <<executionEnvironment>>
!endprocedure

!unquoted procedure DEPLOY_ARTIFACT($name, $label)
artifact "$label" as $name
!endprocedure

!unquoted procedure DEPLOY_COMMPATH($a, $b, $label="")
$a - - $b : $label
!endprocedure





actor "Cloud Service\nConsumers" as CSC

cloud "Cloud Environment" as Cloud {

  package "Virtual Server A (primary)" as VSA {
    component "Cloud Service A\n+ load balancing logic" as CSA1
  }
  package "Virtual Server B" as VSB {
    component "Cloud Service A" as CSA2
  }
  package "Virtual Server C" as VSC {
    component "Cloud Service A" as CSA3
  }
}

CSC - -> CSA1 : (1) requests
CSA1 - -> CSA2 : (2) distribute to\nneighboring server
CSA1 - -> CSA3 : (2) distribute to\nneighboring server

note right of CSA1
  Primary server contains built-in
  load balancing logic and communicates
  with neighboring servers to balance
  the workload.
end note

@enduml

