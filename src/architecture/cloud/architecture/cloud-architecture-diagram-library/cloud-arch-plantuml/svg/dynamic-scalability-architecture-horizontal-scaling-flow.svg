ckgroundColor  #F7F7F2</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="280" x="5" y="386.2904">skinparam NoteBorderColor      #B8B8B0</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="276" x="5" y="405.3583">skinparam NoteFontColor        #2D2D2D</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="223" x="5" y="424.4263">skinparam NoteFontSize         11</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="443.4942"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="311" x="5" y="462.5621">skinparam LegendBackgroundColor #F7F7F2</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="293" x="5" y="481.63">skinparam LegendBorderColor     #B8B8B0</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="289" x="5" y="500.6979">skinparam LegendFontColor       #2D2D2D</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="236" x="5" y="519.7658">skinparam LegendFontSize        10</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="538.8338"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="257" x="5" y="557.9017">skinparam StereotypeFontSize       10</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="277" x="5" y="576.9696">skinparam StereotypeFontStyle      italic</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="304" x="5" y="596.0375">skinparam StereotypeFontColor      #6E6E6E</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="615.1054"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="634.1733"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="402" x="5" y="653.2413">!unquoted procedure UML_NOTE_INFO($id, $target, $text)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="93" x="9" y="672.3092">Syntax Error?</text><!--MD5=[c7b6949224c177d0fc8c8c69167392cd]
@startuml
title Dynamic Scalability Architecture - Horizontal Scaling Flow










skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam actor {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam usecase {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam activity {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  DiamondBackgroundColor #ECEEE8
  DiamondBorderColor #2A8C8C
  DiamondFontColor   #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  BarColor           #1F3B73
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam state {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam swimlane {
  TitleFontColor     #1F3B73
  BorderColor        #4A6FA5
}


!unquoted procedure BEHAV_TRANSITION($from, $to, $label="")
$from - -> $to : $label
!endprocedure

!unquoted procedure BEHAV_GUARDED($from, $to, $event, $guard, $action)
$from - -> $to : $event [$guard] / $action
!endprocedure

!unquoted procedure BEHAV_FORK($name)
fork
!endprocedure

!unquoted procedure BEHAV_JOIN()
end fork
!endprocedure









skinparam participant {
  BackgroundColor    #F7F7F2
  BorderColor        #1F3B73
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam sequence {
  ArrowColor             #2D2D2D
  ArrowFontColor         #2D2D2D
  LifeLineBorderColor    #D8D8D2
  LifeLineBackgroundColor #ECEEE8
  ParticipantBorderColor #1F3B73
  ParticipantBackgroundColor #F7F7F2
  ParticipantFontColor   #2D2D2D
  ActorBorderColor       #2A8C8C
  ActorBackgroundColor   #F7F7F2
  BoxBorderColor         #4A6FA5
  BoxBackgroundColor     #ECEEE8
  GroupBorderColor       #4A6FA5
  GroupBackgroundColor   #ECEEE8
  GroupHeaderFontColor   #1F3B73
  DividerBackgroundColor #ECEEE8
  DividerBorderColor     #4A6FA5
  DividerFontColor       #1F3B73
  ReferenceBorderColor   #4A6FA5
  ReferenceBackgroundColor #ECEEE8
  ReferenceHeaderBackgroundColor #4A6FA5
  ReferenceFontColor     #2D2D2D
}


!unquoted procedure INTER_SYNC($from, $to, $label)
$from -> $to : $label
!endprocedure

!unquoted procedure INTER_ASYNC($from, $to, $label)
$from ->> $to : $label
!endprocedure

!unquoted procedure INTER_RETURN($from, $to, $label)
$from - -> $to : $label
!endprocedure

!unquoted procedure INTER_LOST($from, $label)
$from ->o] : $label
!endprocedure

!unquoted procedure INTER_FOUND($to, $label)
[o-> $to : $label
!endprocedure

!unquoted procedure INTER_SELF($who, $label)
$who -> $who : $label
!endprocedure

!unquoted procedure INTER_ACTIVATE($who)
activate $who
!endprocedure

!unquoted procedure INTER_DEACTIVATE($who)
deactivate $who
!endprocedure


!unquoted procedure INTER_FRAGMENT_ALT($cond)
alt $cond
!endprocedure

!unquoted procedure INTER_FRAGMENT_ELSE($cond)
else $cond
!endprocedure

!unquoted procedure INTER_FRAGMENT_OPT($cond)
opt $cond
!endprocedure

!unquoted procedure INTER_FRAGMENT_LOOP($bound)
loop $bound
!endprocedure

!unquoted procedure INTER_FRAGMENT_PAR($label)
par $label
!endprocedure

!unquoted procedure INTER_FRAGMENT_END()
end
!endprocedure

!unquoted procedure INTER_REF($name, $across)
ref over $across : $name
!endprocedure








autonumber

!unquoted procedure SEQ_ACTOR($alias, $label)
actor "$label" as $alias
!endprocedure

!unquoted procedure SEQ_PARTICIPANT($alias, $label)
participant "$label" as $alias
!endprocedure

!unquoted procedure SEQ_BOUNDARY($alias, $label)
boundary "$label" as $alias
!endprocedure

!unquoted procedure SEQ_CONTROL($alias, $label)
control "$label" as $alias
!endprocedure

!unquoted procedure SEQ_ENTITY($alias, $label)
entity "$label" as $alias
!endprocedure

!unquoted procedure SEQ_DATABASE($alias, $label)
database "$label" as $alias
!endprocedure





actor "Cloud Service\nConsumers" as CSC
participant "Automated\nScaling Listener" as ASL
participant "Cloud Service\nInstances" as CSI
participant "Resource\nReplication" as RR
participant "Virtual Server\nHost(s)" as VSH

CSC -> CSI : (1) send requests
ASL -> CSI : (2) monitor against\npredefined thresholds

== Workload Increases ==
CSC -> CSI : (3) request volume rises\n(workload exceeds thresholds)
ASL -> ASL : (4) evaluate scaling policy
ASL -> ASL : (5) initiate scaling\n(if eligible)
ASL -> RR : (6) signal replication
RR -> VSH : (7) create new\ncloud service instances
RR - -> CSI : new instances added

== Steady State Resumes ==
ASL -> CSI : (8) resume monitoring\nand scaling

note over ASL
  The automated scaling listener is
  configured with workload thresholds and
  logic for how many additional IT
  resources can be provided per the
  consumer's provisioning contract.
end note

@enduml

