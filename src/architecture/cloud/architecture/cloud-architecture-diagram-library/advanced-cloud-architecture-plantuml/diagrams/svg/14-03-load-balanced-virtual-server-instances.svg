@startuml










skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam actor {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam usecase {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam activity {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  DiamondBackgroundColor #ECEEE8
  DiamondBorderColor #2A8C8C
  DiamondFontColor   #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  BarColor           #1F3B73
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam state {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam swimlane {
  TitleFontColor     #1F3B73
  BorderColor        #4A6FA5
}


!unquoted procedure BEHAV_TRANSITION($from, $to, $label="")
$from - -> $to : $label
!endprocedure

!unquoted procedure BEHAV_GUARDED($from, $to, $event, $guard, $action)
$from - -> $to : $event [$guard] / $action
!endprocedure

!unquoted procedure BEHAV_FORK($name)
fork
!endprocedure

!unquoted procedure BEHAV_JOIN()
end fork
!endprocedure









skinparam participant {
  BackgroundColor    #F7F7F2
  BorderColor        #1F3B73
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam sequence {
  ArrowColor             #2D2D2D
  ArrowFontColor         #2D2D2D
  LifeLineBorderColor    #D8D8D2
  LifeLineBackgroundColor #ECEEE8
  ParticipantBorderColor #1F3B73
  ParticipantBackgroundColor #F7F7F2
  ParticipantFontColor   #2D2D2D
  ActorBorderColor       #2A8C8C
  ActorBackgroundColor   #F7F7F2
  BoxBorderColor         #4A6FA5
  BoxBackgroundColor     #ECEEE8
  GroupBorderColor       #4A6FA5
  GroupBackgroundColor   #ECEEE8
  GroupHeaderFontColor   #1F3B73
  DividerBackgroundColor #ECEEE8
  DividerBorderColor     #4A6FA5
  DividerFontColor       #1F3B73
  ReferenceBorderColor   #4A6FA5
  ReferenceBackgroundColor #ECEEE8
  ReferenceHeaderBackgroundColor #4A6FA5
  ReferenceFontColor     #2D2D2D
}


!unquoted procedure INTER_SYNC($from, $to, $label)
$from -> $to : $label
!endprocedure

!unquoted procedure INTER_ASYNC($from, $to, $label)
$from ->> $to : $label
!endprocedure

!unquoted procedure INTER_RETURN($from, $to, $label)
$from - -> $to : $label
!endprocedure

!unquoted procedure INTER_LOST($from, $label)
$from ->] : $label
!endprocedure

!unquoted procedure INTER_FOUND($to, $label)
[-> $to : $label
!endprocedure

!unquoted procedure INTER_SELF($who, $label)
$who -> $who : $label
!endprocedure

!unquoted procedure INTER_ACTIVATE($who)
activate $who
!endprocedure

!unquoted procedure INTER_DEACTIVATE($who)
deactivate $who
!endprocedure


!unquoted procedure INTER_FRAGMENT_ALT($cond)
alt $cond
!endprocedure

!unquoted procedure INTER_FRAGMENT_ELSE($cond)
else $cond
!endprocedure

!unquoted procedure INTER_FRAGMENT_OPT($cond)
opt $cond
!endprocedure

!unquoted procedure INTER_FRAGMENT_LOOP($bound)
loop $bound
!endprocedure

!unquoted procedure INTER_FRAGMENT_PAR($label)
par $label
!endprocedure

!unquoted procedure INTER_FRAGMENT_END()
end
!endprocedure

!unquoted procedure INTER_REF($name, $across)
ref over $across : $name
!endprocedure








autonumber

!unquoted procedure SEQ_ACTOR($alias, $label)
actor "$label" as $alias
!endprocedure

!unquoted procedure SEQ_PARTICIPANT($alias, $label)
participant "$label" as $alias
!endprocedure

!unquoted procedure SEQ_BOUNDARY($alias, $label)
boundary "$label" as $alias
!endprocedure

!unquoted procedure SEQ_CONTROL($alias, $label)
control "$label" as $alias
!endprocedure

!unquoted procedure SEQ_ENTITY($alias, $label)
entity "$label" as $alias
!endprocedure

!unquoted procedure SEQ_DATABASE($alias, $label)
database "$label" as $alias
!endprocedure





title 14.3 Load-Balanced Virtual Server Instances\nCapacity Watchdog Rebalance Sequence

skinparam ParticipantBackgroundColor #F0F4F8
skinparam ParticipantBorderColor #4A6B8A
skinparam noteBackgroundColor #FFF8DC
skinparam noteBorderColor #999999

participant "Capacity\nWatchdog\nMonitor" as CWM
participant "Capacity\nPlanner" as CP
participant "VIM" as VIM
participant "Load Balancer" as LB
participant "Live VM\nMigration" as LVM
participant "Hypervisor\n(origin)" as HO
participant "Hypervisor\n(destination)" as HD

note over HO, HD
  Built on the hypervisor clustering architecture
end note

== Configure ==
CWM -> CWM : 2. load policies\n& thresholds
CWM -> HO : 3. measure physical\n& VS capacity
CWM -> HD : 3. measure physical\n& VS capacity

== Detect ==
CP <- CWM : capacity fluctuation\nreport
CP -> CP : compare physical capacity\nvs VS requirements
CP -> VIM : 4. over-utilization\ndetected

== Rebalance ==
VIM -> LB : 5. redistribute workload\n(predefined thresholds)
LB -> LVM : 6. move selected\nvirtual servers
LVM -> HO : 7. evacuate VS
LVM -> HD : 7. receive VS
HD - -> LVM : ready
LVM - -> LB : migration done

== Continue monitoring ==
loop steady state
  CWM -> HO : 9. monitor
  CWM -> HD : 9. monitor
end

note over CWM
  Mechanisms: hypervisor, resource clustering, virtual server,
  cloud usage monitor (capacity watchdog), automated scaling
  listener, load balancer, logical network perimeter,
  resource replication.
end note

@enduml

