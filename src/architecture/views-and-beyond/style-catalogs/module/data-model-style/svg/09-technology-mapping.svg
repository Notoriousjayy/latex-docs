@startuml 09-technology-mapping







skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam class {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  HeaderBackgroundColor #1F3B73
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
  RoundCorner       6
}

skinparam object {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
}

skinparam component {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam interface {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
}

skinparam node {
  BackgroundColor   #ECEEE8
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam package {
  BackgroundColor   #ECEEE8
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  Style             rectangle
}

skinparam rectangle {
  BackgroundColor   #F7F7F2
  BorderColor       #B8B8B0
  FontColor         #2D2D2D
}


!unquoted procedure STRUCT_GENERALIZATION($child, $parent)
$child - -|> $parent
!endprocedure

!unquoted procedure STRUCT_REALIZATION($class, $iface)
$class ..|> $iface
!endprocedure

!unquoted procedure STRUCT_DEPENDENCY($client, $supplier, $label="")
$client ..> $supplier : $label
!endprocedure

!unquoted procedure STRUCT_ASSOCIATION($a, $b, $label="")
$a - - $b : $label
!endprocedure

!unquoted procedure STRUCT_NAVIGABLE($a, $b, $label="")
$a - -> $b : $label
!endprocedure

!unquoted procedure STRUCT_AGGREGATION($whole, $part, $label="")
$whole o- - $part : $label
!endprocedure

!unquoted procedure STRUCT_COMPOSITION($whole, $part, $label="")
$whole *- - $part : $label
!endprocedure







!unquoted procedure STRUCT_LAYOUT_LR()
left to right direction
!endprocedure

!unquoted procedure STRUCT_LAYOUT_TB()
top to bottom direction
!endprocedure





skinparam componentStyle rectangle

!unquoted procedure COMP_PROVIDES($comp, $iface)
$comp -() $iface
!endprocedure

!unquoted procedure COMP_REQUIRES($comp, $iface)
$comp -(0 $iface
!endprocedure

!unquoted procedure COMP_ASSEMBLY($provider, $iface, $consumer)
$provider -( $iface
$iface )- $consumer
!endprocedure






title <size:18><b>Data Model Technology Mapping</b></size>\n<size:12>How logical model concepts map to different database technologies</size>

rectangle "**Logical Data Model**" as LDM #F5F5F5 {
  rectangle "Entities" as ent #FFFFFF
  rectangle "Attributes" as attr #FFFFFF
  rectangle "Relationships" as rel #FFFFFF
  rectangle "Constraints" as con #FFFFFF
}

rectangle "**Relational DB**\n(PostgreSQL, MySQL)" as RDB #E8F0FE {
  rectangle "Tables" as t1 #D6EAF8
  rectangle "Columns" as t2 #D6EAF8
  rectangle "Foreign Keys" as t3 #D6EAF8
  rectangle "CHECK, UNIQUE" as t4 #D6EAF8
}

rectangle "**Document DB**\n(MongoDB, Couchbase)" as DDB #E8F5E8 {
  rectangle "Documents" as d1 #D5F5E3
  rectangle "Fields" as d2 #D5F5E3
  rectangle "Embedded / $ref" as d3 #D5F5E3
  rectangle "Schema validation" as d4 #D5F5E3
}

rectangle "**Graph DB**\n(Neo4j, Neptune)" as GDB #EDE8F5 {
  rectangle "Nodes" as g1 #E8DAEF
  rectangle "Properties" as g2 #E8DAEF
  rectangle "Edges" as g3 #E8DAEF
  rectangle "Property checks" as g4 #E8DAEF
}

rectangle "**Key-Value Store**\n(Redis, DynamoDB)" as KVS #FDE8D8 {
  rectangle "Values (objects)" as k1 #FAD7A0
  rectangle "Fields in value" as k2 #FAD7A0
  rectangle "Key design" as k3 #FAD7A0
  rectangle "App-level" as k4 #FAD7A0
}

ent -[#4A90D9]-> t1
ent -[#5BA85B]-> d1
ent -[#7B68AE]-> g1
ent -[#D4763C]-> k1

attr -[#4A90D9]-> t2
attr -[#5BA85B]-> d2
attr -[#7B68AE]-> g2
attr -[#D4763C]-> k2

rel -[#4A90D9]-> t3
rel -[#5BA85B]-> d3
rel -[#7B68AE]-> g3
rel -[#D4763C]-> k3

con -[#4A90D9]-> t4
con -[#5BA85B]-> d4
con -[#7B68AE]-> g4
con -[#D4763C]-> k4

@enduml

