@startuml 08-common-patterns







skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam class {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  HeaderBackgroundColor #1F3B73
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
  RoundCorner       6
}

skinparam object {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
}

skinparam component {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam interface {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
}

skinparam node {
  BackgroundColor   #ECEEE8
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam package {
  BackgroundColor   #ECEEE8
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  Style             rectangle
}

skinparam rectangle {
  BackgroundColor   #F7F7F2
  BorderColor       #B8B8B0
  FontColor         #2D2D2D
}


!unquoted procedure STRUCT_GENERALIZATION($child, $parent)
$child - -|> $parent
!endprocedure

!unquoted procedure STRUCT_REALIZATION($class, $iface)
$class ..|> $iface
!endprocedure

!unquoted procedure STRUCT_DEPENDENCY($client, $supplier, $label="")
$client ..> $supplier : $label
!endprocedure

!unquoted procedure STRUCT_ASSOCIATION($a, $b, $label="")
$a - - $b : $label
!endprocedure

!unquoted procedure STRUCT_NAVIGABLE($a, $b, $label="")
$a - -> $b : $label
!endprocedure

!unquoted procedure STRUCT_AGGREGATION($whole, $part, $label="")
$whole o- - $part : $label
!endprocedure

!unquoted procedure STRUCT_COMPOSITION($whole, $part, $label="")
$whole *- - $part : $label
!endprocedure







!unquoted procedure STRUCT_LAYOUT_LR()
left to right direction
!endprocedure

!unquoted procedure STRUCT_LAYOUT_TB()
top to bottom direction
!endprocedure





skinparam componentStyle rectangle

!unquoted procedure COMP_PROVIDES($comp, $iface)
$comp -() $iface
!endprocedure

!unquoted procedure COMP_REQUIRES($comp, $iface)
$comp -(0 $iface
!endprocedure

!unquoted procedure COMP_ASSEMBLY($provider, $iface, $consumer)
$provider -( $iface
$iface )- $consumer
!endprocedure





skinparam padding 4

title Common Decomposition Patterns

together {
  rectangle "**Layered**" as lay_t #37474F;text:white
  rectangle " " as lay #FFFFFF {
    rectangle "Presentation" as l1 #E8EAF6
    rectangle "Business Logic" as l2 #C5CAE9
    rectangle "Data Access" as l3 #B3E5FC
    l1 -[#546E7A]-> l2
    l2 -[#546E7A]-> l3
  }
  note bottom of lay
    Modules by
    abstraction level
  end note
}

together {
  rectangle "**Feature-Based**" as feat_t #37474F;text:white
  rectangle " " as feat #FFFFFF {
    rectangle "Feature A" as f1 #E8EAF6
    rectangle "Feature B" as f2 #C5CAE9
    rectangle "Feature C" as f3 #B3E5FC
  }
  note bottom of feat
    Modules per
    user-visible feature
  end note
}

together {
  rectangle "**Domain-Driven**" as ddd_t #37474F;text:white
  rectangle " " as ddd #FFFFFF {
    rectangle "Bounded\nContext 1" as d1 #E8EAF6
    rectangle "Bounded\nContext 2" as d2 #C5CAE9
    d1 -[#546E7A]-> d2 : interface
  }
  note bottom of ddd
    Modules per
    bounded context
  end note
}

together {
  rectangle "**Plugin**" as plug_t #37474F;text:white
  rectangle " " as plug #FFFFFF {
    rectangle "Core" as p1 #E8EAF6
    rectangle "Plugin A" as p2 #C5CAE9
    rectangle "Plugin B" as p3 #B3E5FC
    p2 -[#546E7A]-> p1
    p3 -[#546E7A]-> p1
  }
  note bottom of plug
    Core + extensible
    plugin points
  end note
}

together {
  rectangle "**Facade**" as fac_t #37474F;text:white
  rectangle " " as fac #FFFFFF {
    rectangle "Facade" as fa1 #E8EAF6
    rectangle "Internal A" as fa2 #C5CAE9
    rectangle "Internal B" as fa3 #C5CAE9
    fa1 -[#546E7A]-> fa2
    fa1 -[#546E7A]-> fa3
  }
  note bottom of fac
    Simplified interface
    to complex subsystem
  end note
}

lay_t -[hidden]right-> feat_t
feat_t -[hidden]right-> ddd_t
ddd_t -[hidden]right-> plug_t
plug_t -[hidden]right-> fac_t

@enduml

