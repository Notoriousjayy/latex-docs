@startuml

title Concurrency Control & Consistency Models\nManaging concurrent access to shared data








skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam class {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  HeaderBackgroundColor #1F3B73
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
  RoundCorner       6
}

skinparam object {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
}

skinparam component {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam interface {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
}

skinparam node {
  BackgroundColor   #ECEEE8
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam package {
  BackgroundColor   #ECEEE8
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  Style             rectangle
}

skinparam rectangle {
  BackgroundColor   #F7F7F2
  BorderColor       #B8B8B0
  FontColor         #2D2D2D
}


!unquoted procedure STRUCT_GENERALIZATION($child, $parent)
$child - -|> $parent
!endprocedure

!unquoted procedure STRUCT_REALIZATION($class, $iface)
$class ..|> $iface
!endprocedure

!unquoted procedure STRUCT_DEPENDENCY($client, $supplier, $label="")
$client ..> $supplier : $label
!endprocedure

!unquoted procedure STRUCT_ASSOCIATION($a, $b, $label="")
$a - - $b : $label
!endprocedure

!unquoted procedure STRUCT_NAVIGABLE($a, $b, $label="")
$a - -> $b : $label
!endprocedure

!unquoted procedure STRUCT_AGGREGATION($whole, $part, $label="")
$whole o- - $part : $label
!endprocedure

!unquoted procedure STRUCT_COMPOSITION($whole, $part, $label="")
$whole *- - $part : $label
!endprocedure







!unquoted procedure STRUCT_LAYOUT_LR()
left to right direction
!endprocedure

!unquoted procedure STRUCT_LAYOUT_TB()
top to bottom direction
!endprocedure





skinparam componentStyle rectangle

!unquoted procedure COMP_PROVIDES($comp, $iface)
$comp -() $iface
!endprocedure

!unquoted procedure COMP_REQUIRES($comp, $iface)
$comp -(0 $iface
!endprocedure

!unquoted procedure COMP_ASSEMBLY($provider, $iface, $consumer)
$provider -( $iface
$iface )- $consumer
!endprocedure





rectangle "Concurrency Control Strategies" as concurrency {
    rectangle "Pessimistic Locking" as pessimistic #FFCDD2 {
        rectangle "Lock before access" as lock1 #FFEBEE
        rectangle "Block conflicting ops" as lock2 #FFEBEE
        rectangle "Deadlock possible" as lock3 #FFEBEE
    }
    
    rectangle "Optimistic Locking" as optimistic #C8E6C9 {
        rectangle "Allow concurrent access" as opt1 #E8F5E9
        rectangle "Detect conflicts at commit" as opt2 #E8F5E9
        rectangle "Retry on conflict" as opt3 #E8F5E9
    }
    
    rectangle "MVCC" as mvcc #BBDEFB {
        rectangle "Multiple versions" as mv1 #E3F2FD
        rectangle "Snapshot isolation" as mv2 #E3F2FD
        rectangle "No read blocking" as mv3 #E3F2FD
    }
}

rectangle "Consistency Models" as consistency {
    rectangle "Strong Consistency" as strong #E8F5E9
    rectangle "Eventual Consistency" as eventual #FFF3E0
    rectangle "Causal Consistency" as causal #E3F2FD
}

rectangle "CAP Theorem Trade-offs" as cap #F3E5F5 {
    rectangle "CP (Consistent + Partition-tolerant)" as cp #E1BEE7
    rectangle "AP (Available + Partition-tolerant)" as ap #E1BEE7
}

note bottom of strong
  Reads see latest write
  Higher latency
end note

note bottom of eventual
  Temporary inconsistency
  Higher availability
end note

note bottom of causal
  Preserves cause-effect
  Balanced approach
end note

note bottom of cap
  During network partition:
  CP: Sacrifice availability
  AP: Sacrifice consistency
end note

legend bottom
  Choose concurrency control and consistency model
  based on application requirements and trade-offs
endlegend

@enduml

