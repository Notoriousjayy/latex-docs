33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="596.0375"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="615.1054"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="402" x="5" y="634.1733">!unquoted procedure UML_NOTE_INFO($id, $target, $text)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="93" x="9" y="653.2413">Syntax Error?</text><!--MD5=[8e29b7cf53a6ab44e3edb5413920d3a3]
@startuml 09-nat-traversal








skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam class {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  HeaderBackgroundColor #1F3B73
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
  RoundCorner       6
}

skinparam object {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
}

skinparam component {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam interface {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
}

skinparam node {
  BackgroundColor   #ECEEE8
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam package {
  BackgroundColor   #ECEEE8
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  Style             rectangle
}

skinparam rectangle {
  BackgroundColor   #F7F7F2
  BorderColor       #B8B8B0
  FontColor         #2D2D2D
}


!unquoted procedure STRUCT_GENERALIZATION($child, $parent)
$child - -|> $parent
!endprocedure

!unquoted procedure STRUCT_REALIZATION($class, $iface)
$class ..|> $iface
!endprocedure

!unquoted procedure STRUCT_DEPENDENCY($client, $supplier, $label="")
$client ..> $supplier : $label
!endprocedure

!unquoted procedure STRUCT_ASSOCIATION($a, $b, $label="")
$a - - $b : $label
!endprocedure

!unquoted procedure STRUCT_NAVIGABLE($a, $b, $label="")
$a - -> $b : $label
!endprocedure

!unquoted procedure STRUCT_AGGREGATION($whole, $part, $label="")
$whole o- - $part : $label
!endprocedure

!unquoted procedure STRUCT_COMPOSITION($whole, $part, $label="")
$whole *- - $part : $label
!endprocedure







!unquoted procedure STRUCT_LAYOUT_LR()
left to right direction
!endprocedure

!unquoted procedure STRUCT_LAYOUT_TB()
top to bottom direction
!endprocedure





skinparam package {
  Style folder
}

!unquoted procedure PKG_IMPORT($a, $b)
$a ..> $b : <<import>>
!endprocedure

!unquoted procedure PKG_MERGE($a, $b)
$a ..> $b : <<merge>>
!endprocedure

!unquoted procedure PKG_ACCESS($a, $b)
$a ..> $b : <<access>>
!endprocedure





skinparam padding 4

title <b>NAT Traversal Techniques for P2P Connectivity</b>\nStrategies enabling direct peer connections through network barriers

package "STUN: Discover Public Address" as STUN {
  rectangle "Peer A" as stun_a <<peer>>
  rectangle " NAT " as stun_nat <<nat>>
  rectangle "STUN\nServer" as stun_srv <<infra>>

  stun_a -[#3B82F6]-> stun_nat
  stun_nat -[#3B82F6]-> stun_srv : What's my IP?
  stun_srv -[#3B82F6,dashed]-> stun_nat : Your IP = 1.2.3.4
  stun_nat -[#3B82F6,dashed]-> stun_a
}

package "Hole Punching: Direct Connection" as HP {
  rectangle "Peer B" as hp_b <<peer>>
  rectangle "NAT B" as hp_natb <<nat>>
  rectangle "NAT C" as hp_natc <<nat>>
  rectangle "Peer C" as hp_c <<peer>>

  hp_b -[#10B981,bold]-> hp_natb
  hp_natb -[#10B981,bold]-> hp_natc : simultaneous open
  hp_natc -[#10B981,bold]-> hp_c
}

package "TURN: Relayed Connection" as TURN {
  rectangle "Peer D" as turn_d <<peer>>
  rectangle "TURN\nRelay" as turn_relay <<relay>>
  rectangle "Peer E" as turn_e <<peer>>

  turn_d -[#8B5CF6]-> turn_relay : send
  turn_relay -[#8B5CF6]-> turn_e : forward
  turn_e -[#8B5CF6,dashed]-> turn_relay : reply
  turn_relay -[#8B5CF6,dashed]-> turn_d : forward
}

note bottom
  **ICE (Interactive Connectivity Establishment)** coordinates these techniques:
  1. Try direct connection first
  2. Attempt STUN-assisted hole punching
  3. Fall back to TURN relay as last resort
end note
@enduml

