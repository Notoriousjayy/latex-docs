s" textLength="0" x="9" y="535.4942"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="311" x="5" y="554.5621">skinparam LegendBackgroundColor #F7F7F2</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="293" x="5" y="573.63">skinparam LegendBorderColor     #B8B8B0</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="289" x="5" y="592.6979">skinparam LegendFontColor       #2D2D2D</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="236" x="5" y="611.7658">skinparam LegendFontSize        10</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="630.8338"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="257" x="5" y="649.9017">skinparam StereotypeFontSize       10</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="277" x="5" y="668.9696">skinparam StereotypeFontStyle      italic</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="304" x="5" y="688.0375">skinparam StereotypeFontColor      #6E6E6E</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="707.1054"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="726.1733"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="402" x="5" y="745.2413">!unquoted procedure UML_NOTE_INFO($id, $target, $text)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="93" x="9" y="764.3092">Syntax Error?</text><!--MD5=[7f84edc32b74c949e2c104ea59b4a88f]
@startuml 05-dht-lookup










skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam actor {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam usecase {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam activity {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  DiamondBackgroundColor #ECEEE8
  DiamondBorderColor #2A8C8C
  DiamondFontColor   #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  BarColor           #1F3B73
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam state {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam swimlane {
  TitleFontColor     #1F3B73
  BorderColor        #4A6FA5
}


!unquoted procedure BEHAV_TRANSITION($from, $to, $label="")
$from - -> $to : $label
!endprocedure

!unquoted procedure BEHAV_GUARDED($from, $to, $event, $guard, $action)
$from - -> $to : $event [$guard] / $action
!endprocedure

!unquoted procedure BEHAV_FORK($name)
fork
!endprocedure

!unquoted procedure BEHAV_JOIN()
end fork
!endprocedure









skinparam participant {
  BackgroundColor    #F7F7F2
  BorderColor        #1F3B73
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam sequence {
  ArrowColor             #2D2D2D
  ArrowFontColor         #2D2D2D
  LifeLineBorderColor    #D8D8D2
  LifeLineBackgroundColor #ECEEE8
  ParticipantBorderColor #1F3B73
  ParticipantBackgroundColor #F7F7F2
  ParticipantFontColor   #2D2D2D
  ActorBorderColor       #2A8C8C
  ActorBackgroundColor   #F7F7F2
  BoxBorderColor         #4A6FA5
  BoxBackgroundColor     #ECEEE8
  GroupBorderColor       #4A6FA5
  GroupBackgroundColor   #ECEEE8
  GroupHeaderFontColor   #1F3B73
  DividerBackgroundColor #ECEEE8
  DividerBorderColor     #4A6FA5
  DividerFontColor       #1F3B73
  ReferenceBorderColor   #4A6FA5
  ReferenceBackgroundColor #ECEEE8
  ReferenceHeaderBackgroundColor #4A6FA5
  ReferenceFontColor     #2D2D2D
}


!unquoted procedure INTER_SYNC($from, $to, $label)
$from -> $to : $label
!endprocedure

!unquoted procedure INTER_ASYNC($from, $to, $label)
$from ->> $to : $label
!endprocedure

!unquoted procedure INTER_RETURN($from, $to, $label)
$from - -> $to : $label
!endprocedure

!unquoted procedure INTER_LOST($from, $label)
$from ->] : $label
!endprocedure

!unquoted procedure INTER_FOUND($to, $label)
[-> $to : $label
!endprocedure

!unquoted procedure INTER_SELF($who, $label)
$who -> $who : $label
!endprocedure

!unquoted procedure INTER_ACTIVATE($who)
activate $who
!endprocedure

!unquoted procedure INTER_DEACTIVATE($who)
deactivate $who
!endprocedure


!unquoted procedure INTER_FRAGMENT_ALT($cond)
alt $cond
!endprocedure

!unquoted procedure INTER_FRAGMENT_ELSE($cond)
else $cond
!endprocedure

!unquoted procedure INTER_FRAGMENT_OPT($cond)
opt $cond
!endprocedure

!unquoted procedure INTER_FRAGMENT_LOOP($bound)
loop $bound
!endprocedure

!unquoted procedure INTER_FRAGMENT_PAR($label)
par $label
!endprocedure

!unquoted procedure INTER_FRAGMENT_END()
end
!endprocedure

!unquoted procedure INTER_REF($name, $across)
ref over $across : $name
!endprocedure








autonumber

!unquoted procedure SEQ_ACTOR($alias, $label)
actor "$label" as $alias
!endprocedure

!unquoted procedure SEQ_PARTICIPANT($alias, $label)
participant "$label" as $alias
!endprocedure

!unquoted procedure SEQ_BOUNDARY($alias, $label)
boundary "$label" as $alias
!endprocedure

!unquoted procedure SEQ_CONTROL($alias, $label)
control "$label" as $alias
!endprocedure

!unquoted procedure SEQ_ENTITY($alias, $label)
entity "$label" as $alias
!endprocedure

!unquoted procedure SEQ_DATABASE($alias, $label)
database "$label" as $alias
!endprocedure





skinparam sequenceArrowThickness 2

title <b>DHT Lookup: Structured Overlay Routing</b>\nO(log N) hops to locate any key in the network

skinparam participant {
  BackgroundColor #10B981
  FontColor #FFFFFF
  BorderColor #059669
}

participant "Requester\n(Node 8)" as req
participant "Node 21" as n21
participant "Node 42" as n42
participant "Responsible\n(Node 53)" as resp

req -> n21 : lookup(key=50)
note right: Closest known node\nto key 50 in finger table

n21 -> n42 : forward(key=50)
note right: Progressively closer\nin identifier space

n42 -> resp : forward(key=50)
note right: Node 53 is responsible\nfor key range including 50

resp - -> n42 : found(key=50, value)
n42 - -> n21 : relay(value)
n21 - -> req : result(value)

note over req, resp
  Each hop halves the remaining distance in identifier space.
  For N peers, lookup completes in O(log N) hops.
end note
@enduml

