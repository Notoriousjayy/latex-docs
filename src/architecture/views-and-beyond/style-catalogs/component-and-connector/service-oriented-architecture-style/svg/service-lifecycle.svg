@startuml service-lifecycle







skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam actor {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam usecase {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam activity {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  DiamondBackgroundColor #ECEEE8
  DiamondBorderColor #2A8C8C
  DiamondFontColor   #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  BarColor           #1F3B73
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam state {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam swimlane {
  TitleFontColor     #1F3B73
  BorderColor        #4A6FA5
}


!unquoted procedure BEHAV_TRANSITION($from, $to, $label="")
$from - -> $to : $label
!endprocedure

!unquoted procedure BEHAV_GUARDED($from, $to, $event, $guard, $action)
$from - -> $to : $event [$guard] / $action
!endprocedure

!unquoted procedure BEHAV_FORK($name)
fork
!endprocedure

!unquoted procedure BEHAV_JOIN()
end fork
!endprocedure









skinparam state {
  BackgroundColor<<composite>> #ECEEE8
  BorderColor<<composite>>     #4A6FA5
}

!unquoted procedure STM_ENTRY($state, $action)
$state : entry / $action
!endprocedure

!unquoted procedure STM_EXIT($state, $action)
$state : exit / $action
!endprocedure

!unquoted procedure STM_DO($state, $action)
$state : do / $action
!endprocedure

!unquoted procedure STM_INTERNAL($state, $event, $action)
$state : $event / $action
!endprocedure






skinparam padding 8

title Service Lifecycle

[*] - -> Design

state "Design" as Design <<active>> : Define contracts\nSpecify behavior\nPlan resources

Design - -> Development : approved

state "Development" as Development <<active>> : Implement service\nUnit testing\nDocumentation

Development - -> Testing : code complete

state "Testing" as Testing <<transition>> : Integration tests\nPerformance tests\nSecurity validation

Testing - -> Development : defects found
Testing - -> Deployment : tests pass

state "Deployment" as Deployment <<transition>> : Release to production\nRegister in catalog\nConfigure monitoring

Deployment - -> Operation : deployed

state "Operation" as Operation <<active>> : Monitor health\nHandle incidents\nScale as needed

Operation - -> Versioning : changes needed

state "Versioning" as Versioning <<transition>> : Maintain compatibility\nDeprecate old versions\nMigrate consumers

Versioning - -> Development : major changes
Versioning - -> Operation : minor updates

Operation - -> Retirement : no longer needed

state "Retirement" as Retirement <<end>> : Notify consumers\nMigrate dependencies\nDecommission

Retirement - -> [*]

note right of Design
  **Governance checkpoint**
  Review service contracts
  before development
end note

note right of Operation
  **Longest phase**
  Most services spend
  majority of time here
end note

note right of Retirement
  **Plan exit strategy**
  from the beginning
end note

@enduml

