font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="276" x="5" y="386.2904">skinparam NoteFontColor        #2D2D2D</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="223" x="5" y="405.3583">skinparam NoteFontSize         11</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="424.4263"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="311" x="5" y="443.4942">skinparam LegendBackgroundColor #F7F7F2</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="293" x="5" y="462.5621">skinparam LegendBorderColor     #B8B8B0</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="289" x="5" y="481.63">skinparam LegendFontColor       #2D2D2D</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="236" x="5" y="500.6979">skinparam LegendFontSize        10</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="519.7658"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="257" x="5" y="538.8338">skinparam StereotypeFontSize       10</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="277" x="5" y="557.9017">skinparam StereotypeFontStyle      italic</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="304" x="5" y="576.9696">skinparam StereotypeFontColor      #6E6E6E</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="596.0375"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="615.1054"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="402" x="5" y="634.1733">!unquoted procedure UML_NOTE_INFO($id, $target, $text)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="93" x="9" y="653.2413">Syntax Error?</text><!--MD5=[cf6fd9bf862d6bec4a84a50aa3b48915]
@startuml








skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam class {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  HeaderBackgroundColor #1F3B73
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
  RoundCorner       6
}

skinparam object {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
}

skinparam component {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam interface {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
}

skinparam node {
  BackgroundColor   #ECEEE8
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam package {
  BackgroundColor   #ECEEE8
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  Style             rectangle
}

skinparam rectangle {
  BackgroundColor   #F7F7F2
  BorderColor       #B8B8B0
  FontColor         #2D2D2D
}


!unquoted procedure STRUCT_GENERALIZATION($child, $parent)
$child - -|> $parent
!endprocedure

!unquoted procedure STRUCT_REALIZATION($class, $iface)
$class ..|> $iface
!endprocedure

!unquoted procedure STRUCT_DEPENDENCY($client, $supplier, $label="")
$client ..> $supplier : $label
!endprocedure

!unquoted procedure STRUCT_ASSOCIATION($a, $b, $label="")
$a - - $b : $label
!endprocedure

!unquoted procedure STRUCT_NAVIGABLE($a, $b, $label="")
$a - -> $b : $label
!endprocedure

!unquoted procedure STRUCT_AGGREGATION($whole, $part, $label="")
$whole o- - $part : $label
!endprocedure

!unquoted procedure STRUCT_COMPOSITION($whole, $part, $label="")
$whole *- - $part : $label
!endprocedure







!unquoted procedure STRUCT_LAYOUT_LR()
left to right direction
!endprocedure

!unquoted procedure STRUCT_LAYOUT_TB()
top to bottom direction
!endprocedure





skinparam package {
  Style folder
}

!unquoted procedure PKG_IMPORT($a, $b)
$a ..> $b : <<import>>
!endprocedure

!unquoted procedure PKG_MERGE($a, $b)
$a ..> $b : <<merge>>
!endprocedure

!unquoted procedure PKG_ACCESS($a, $b)
$a ..> $b : <<access>>
!endprocedure





title Small Business Core Systems Operating Model

package "Demand Creation" {
  rectangle "Marketing and\nLead Generation" as Marketing
  rectangle "Sales and\nLead Conversion" as Sales
}

package "Value Delivery" {
  rectangle "Operations and\nFulfillment" as Ops
  rectangle "Customer\nExperience" as CX
}

package "Business Control" {
  rectangle "Financial\nManagement" as Finance
  rectangle "Administration and\nIT Security" as AdminIT
  rectangle "HR and People\nManagement" as HR
}

rectangle "Leadership and\nStrategy" as Leadership
rectangle "SOP and Tooling\nLayer" as SOPTools
rectangle "KPI and Continuous\nImprovement Layer" as KPI

Marketing - -> Sales : qualified leads\nsource context
Sales - -> Ops : closed-won handoff\nscope and commitments
Ops - -> CX : product or service\ndelivery
Ops - -> Finance : delivery milestones\nbilling evidence
Sales - -> Finance : bookings\nforecast
HR - -> AdminIT : onboarding and\noffboarding triggers
AdminIT - -> Marketing : tools, documents,\naccess, backups
AdminIT - -> Sales
AdminIT - -> Ops
AdminIT - -> Finance
Leadership - -> Marketing : goals and positioning
Leadership - -> Sales : revenue targets
Leadership - -> Ops : capacity priorities
Leadership - -> Finance : budget and cash priorities
Leadership - -> HR : workforce plan

SOPTools ..> Marketing : repeatable work
SOPTools ..> Sales
SOPTools ..> Ops
SOPTools ..> Finance
SOPTools ..> AdminIT
SOPTools ..> HR
SOPTools ..> Leadership

Marketing ..> KPI : campaign metrics
Sales ..> KPI : conversion metrics
Ops ..> KPI : delivery metrics
Finance ..> KPI : cash and margin metrics
AdminIT ..> KPI : reliability and security metrics
HR ..> KPI : people capacity metrics
KPI - -> Leadership : scorecard, trends,\nrisks, decisions
Leadership - -> SOPTools : improvement priorities\nand operating standards

note right of SOPTools
SOPs define triggers, owners,
steps, evidence, and escalation.
Tools support the SOP; they do
not replace process ownership.
end note

note bottom of KPI
The improvement loop converts
KPI gaps into prioritized actions,
updated SOPs, tooling changes,
and leadership decisions.
end note

@enduml

