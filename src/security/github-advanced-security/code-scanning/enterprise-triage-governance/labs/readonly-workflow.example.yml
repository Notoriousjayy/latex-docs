# EXAMPLE ONLY: not in .github/workflows; will never run until reviewed and copied.
# No token with write privileges and no GitHub API mutations.
name: appsec-governance-offline-example
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-policy-test:
    runs-on: ubuntu-latest
    steps:
      # Pin actions by reviewed commit SHA before actual adoption.
      - name: Checkout (example; pin before adoption)
        uses: actions/checkout@v4
      - name: Run isolated unit tests
        run: python3 -m unittest discover -s tests -p 'test_enterprise_appsec_governance.py'
      - name: Explain authority boundary
        run: echo 'Offline classification only. GitHub enforces checks and reviews.'
