@startuml







skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam actor {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam usecase {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StereotypeFontColor #6E6E6E
}

skinparam activity {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  DiamondBackgroundColor #ECEEE8
  DiamondBorderColor #2A8C8C
  DiamondFontColor   #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  BarColor           #1F3B73
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam state {
  BackgroundColor    #F7F7F2
  BorderColor        #2A8C8C
  FontColor          #2D2D2D
  StartColor         #1F3B73
  EndColor           #B5471F
  ArrowColor         #2D2D2D
  ArrowFontColor     #2D2D2D
}

skinparam swimlane {
  TitleFontColor     #1F3B73
  BorderColor        #4A6FA5
}


!unquoted procedure BEHAV_TRANSITION($from, $to, $label="")
$from - -> $to : $label
!endprocedure

!unquoted procedure BEHAV_GUARDED($from, $to, $event, $guard, $action)
$from - -> $to : $event [$guard] / $action
!endprocedure

!unquoted procedure BEHAV_FORK($name)
fork
!endprocedure

!unquoted procedure BEHAV_JOIN()
end fork
!endprocedure









skinparam ConditionEndStyle hline

!unquoted procedure ACT_LANE($title)
|$title|
!endprocedure

!unquoted procedure ACT_DO($label)
:$label;
!endprocedure

!unquoted procedure ACT_IF($cond)
if ($cond) then (yes)
!endprocedure

!unquoted procedure ACT_ELSE()
else (no)
!endprocedure

!unquoted procedure ACT_ENDIF()
endif
!endprocedure





title AppSec Process 13: 16-Gate CI/CD Pipeline — AppSec Overlay (AppCode-Centric)


start

partition "Source Code Management" {
  :Source Code Version Control<<gate>>;
  note right
  AppCode requirements:
  - Repo/pipeline tagged with AppCode
  - Ownership mapping (AppCode -> team)
  Related processes: 01, 02, 09
  end note

  :Optimum Branching Strategy<<gate>>;
  note right
  Controls:
  - Protected branches + required reviews
  - Required status checks (quality + security)
  Related processes: 02
  end note
}

partition "Build & Quality" {
  :Static Analysis<<gate>>;
  note right
  Tools:
  - SonarQube (11)
  - GHAS CodeQL / Coverity (03)
  Related processes: 02, 03, 11
  end note

  :80% Code Coverage<<gate>>;
  note right
  Controls:
  - Unit tests + coverage threshold
  Related processes: 02
  end note
}

partition "Security Scanning" {
  :Vulnerability Scan<<gate>>;
  note right
  Tools:
  - Trivy (IaC, images, SBOM) (06)
  - GHAS CodeQL findings contribute (03)
  Related processes: 02, 06, 09
  end note

  :Open Source Scan<<gate>>;
  note right
  Tools:
  - GHAS dependency review + Dependabot (04)
  - License policy checks (04)
  Related processes: 04, 09
  end note
}

partition "Artifact Management" {
  :Artifact Version Control<<gate>>;
  note right
  Controls:
  - Immutable, versioned artifacts
  - Labels include AppCode + build metadata
  Related processes: 06, 09
  end note
}

partition "Infrastructure Provisioning" {
  :Automatic Provision<<gate>>;
  :Immutable Servers<<gate>>;
  note right
  Controls:
  - IaC-defined infrastructure
  - Immutable image bake
  - Trivy config scan supports IaC assurance (06)
  Related processes: 06
  end note
}

partition "Integration & Performance" {
  :Integration Testing<<gate>>;
  note right
  Tools:
  - DAST (InsightAppSec) against test envs (07)
  - IAST (Seeker) during functional tests (08)
  Related processes: 07, 08
  end note

  :Performance Testing<<gate>>;
  note right
  Controls:
  - Load/latency thresholds
  - Security impact: rate limits, stability under load
  Related processes: 09 (risk prioritization)
  end note
}

partition "Automation & Release" {
  :Full Automation on Commit<<gate>>;
  note right
  Controls:
  - Commit -> build -> test -> scan -> deploy
  - Fail-fast + consistent evidence trails (AppCode)
  Related processes: 02, 09
  end note

  :Zero Downtime Release<<gate>>;
  :Feature Toggle<<gate>>;
  note right
  Controls:
  - Progressive delivery (blue/green/canary)
  - Feature flags for safe rollout
  Related processes: 12 (non-compliance enforcement)
  end note
}

partition "Change Management" {
  :Automated Change Order<<gate>>;
  :Automated Rollback<<gate>>;
  note right
  Controls:
  - Auto change records include AppCode + risk summary
  - Rollback on health/SLO breach
  Related processes: 09, 12
  end note
}

stop

legend left
**Process crosswalk (IDs):**
01 Onboarding & coverage plan
02 CI security gates
03 Static analysis triage (GHAS/Coverity/SonarQube)
04 SCA & dependencies
05 Secret scanning response
06 Trivy container/IaC/SBOM
07 DAST (InsightAppSec)
08 IAST verified (Seeker)
09 Unified vulnerability lifecycle
10 COTS/SaaS vendor risk
11 SonarQube quality gate
12 Non-compliant app handling
endlegend
@enduml

