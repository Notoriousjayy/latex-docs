# Example only: review privileges, feature eligibility and coverage before activation.
# Copy into .github/workflows/ only after threat-model review.
name: example-sast-codeql
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
# Avoid combining CodeQL default and advanced setup without planning.
# CodeQL with write-permission to security-events may be restricted for fork PRs.
# Analyzing untrusted builds requires separate runner/privilege threat modeling.
