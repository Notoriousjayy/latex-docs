name: Verify example candidate
on: [pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s tests
# Teaching example only: production must run protected tests from a trusted source
# in an isolated runner, and enforce required checks via repository rules.
