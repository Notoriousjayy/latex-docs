# INACTIVE EXAMPLE. It is NOT under .github/workflows.
# Pin reviewed action commit SHAs before production use.
name: Embedded C99 Quality Example (inactive)
on: [workflow_dispatch, pull_request]
permissions:
  contents: read
jobs:
  host-c99:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # illustrative tag, not production-pinned
      - name: Install C static analysis
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run reproducible host checks
        run: |
          make -C examples/c99 clean test
          cppcheck --enable=warning,style,performance,portability \
            --std=c99 --error-exitcode=1 examples/c99
