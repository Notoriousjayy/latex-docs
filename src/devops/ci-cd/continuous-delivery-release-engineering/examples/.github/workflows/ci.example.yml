# COPY to .github/workflows/ci.yml only in a disposable application repo.
# Demo tags are shown for readability; pin actions to reviewed commit SHAs before production adoption.
name: CD Suite CI (example)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test service and delivery utilities
        run: |
          python -m unittest discover -s examples/lambda -p 'test_*.py' -v
          python -m unittest discover -s examples/scripts -p 'test_*.py' -v
      - name: Build once and verify artifact identity
        run: |
          python examples/scripts/build_artifact.py --revision "$GITHUB_SHA"
          python examples/scripts/verify_artifact.py examples/lambda/function.zip examples/lambda/function.zip.manifest.json --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ github.sha }}
          path: |
            examples/lambda/function.zip
            examples/lambda/function.zip.manifest.json
          if-no-files-found: error
          retention-days: 14
