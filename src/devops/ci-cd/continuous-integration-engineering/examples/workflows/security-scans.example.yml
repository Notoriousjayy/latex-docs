# TEACHING WORKFLOW: scope and entitlements must be reviewed prior to activation.
# Action tags are illustrative; pin verified full commit SHA for production.
name: example-security-checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  python-codeql:
    permissions:
      contents: read
      security-events: write # Needed for upload; confirm PR fork policy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
  # Dependency/secret scans need separate product access, rule sets and triage.
  # Do not treat a single CodeQL job as full DevSecOps conformance.
