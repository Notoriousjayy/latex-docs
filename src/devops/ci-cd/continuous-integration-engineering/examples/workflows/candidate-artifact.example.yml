# TEACHING EXAMPLE: release candidate packaging, not a production release.
# Requires an eligible repository for GitHub attestations; action tags must be SHA-pinned.
name: example-candidate-artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install build
          python -m build python-service --outdir dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-dist
          path: dist/
