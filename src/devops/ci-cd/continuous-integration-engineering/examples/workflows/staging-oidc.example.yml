# TEACHING OIDC AUTHENTICATION DEMO, NOT AN APPLICATION DEPLOYMENT.
# Activate only after configuring a protected 'staging' environment and strict cloud role trust.
name: example-staging-identity-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify authorized identity without mutation
        run: aws sts get-caller-identity
