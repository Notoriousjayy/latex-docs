@startuml








skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam class {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  HeaderBackgroundColor #1F3B73
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
  RoundCorner       6
}

skinparam object {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
}

skinparam component {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam interface {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
}

skinparam node {
  BackgroundColor   #ECEEE8
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam package {
  BackgroundColor   #ECEEE8
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  Style             rectangle
}

skinparam rectangle {
  BackgroundColor   #F7F7F2
  BorderColor       #B8B8B0
  FontColor         #2D2D2D
}


!unquoted procedure STRUCT_GENERALIZATION($child, $parent)
$child - -|> $parent
!endprocedure

!unquoted procedure STRUCT_REALIZATION($class, $iface)
$class ..|> $iface
!endprocedure

!unquoted procedure STRUCT_DEPENDENCY($client, $supplier, $label="")
$client ..> $supplier : $label
!endprocedure

!unquoted procedure STRUCT_ASSOCIATION($a, $b, $label="")
$a - - $b : $label
!endprocedure

!unquoted procedure STRUCT_NAVIGABLE($a, $b, $label="")
$a - -> $b : $label
!endprocedure

!unquoted procedure STRUCT_AGGREGATION($whole, $part, $label="")
$whole o- - $part : $label
!endprocedure

!unquoted procedure STRUCT_COMPOSITION($whole, $part, $label="")
$whole *- - $part : $label
!endprocedure







!unquoted procedure STRUCT_LAYOUT_LR()
left to right direction
!endprocedure

!unquoted procedure STRUCT_LAYOUT_TB()
top to bottom direction
!endprocedure





skinparam node {
  RoundCorner 4
}
skinparam artifact {
  BackgroundColor #F7F7F2
  BorderColor     #4A6FA5
  FontColor       #2D2D2D
}

!unquoted procedure DEPLOY_DEVICE($name, $label)
node "$label" as $name <<device>>
!endprocedure

!unquoted procedure DEPLOY_EXECENV($name, $label)
node "$label" as $name <<executionEnvironment>>
!endprocedure

!unquoted procedure DEPLOY_ARTIFACT($name, $label)
artifact "$label" as $name
!endprocedure

!unquoted procedure DEPLOY_COMMPATH($a, $b, $label="")
$a - - $b : $label
!endprocedure





skinparam folder {
  BorderColor #333333
  FontColor #111111
}
skinparam wrapWidth 220
skinparam maxMessageSize 120

title Authentik Self-Hosted Docker Compose Architecture

actor "Users / Admins" as users
rectangle "HTTPS Reverse Proxy\n- TLS termination\n- HTTP to HTTPS redirect\n- WebSocket upgrade support\n- Required forwarding headers" as proxy

node "Docker Compose Host" as host {
  rectangle "authentik Server\n- Web UI\n- API\n- Identity flows\n- HTTP 9000 / HTTPS 9443 default" as server
  rectangle "authentik Worker\n- Background tasks\n- Blueprint watcher\n- Certificate watcher\n- Optional outpost automation" as worker
  database "PostgreSQL\nPersistent users, policies,\nproviders, flows, and config" as db
  folder "Static Volumes\n/data\n/certs\n/custom-templates\n/blueprints" as storage
}

rectangle "Applications" as apps {
  rectangle "Application + Provider Pair\nOIDC / OAuth2, SAML, LDAP,\nProxy Provider, or other supported provider" as app_provider
}

rectangle "Outposts\nProxy / LDAP extension points\nVersion must match core instance" as outposts
rectangle "Monitoring" as monitoring {
  rectangle "Server health\n/-/health/live/\n/-/health/ready/" as health
  rectangle "Worker health\nak healthcheck" as workerhealth
  rectangle "Outpost health\n/outpost.goauthentik.io/ping" as outposthealth
  rectangle "Metrics\nPort 9300" as metrics
}

users - -> proxy : HTTPS requests
proxy - -> server : Forwarded HTTPS context\nHost + X-Forwarded-*\nWebSocket upgrades
server - -> db : persistent data
worker - -> db : background task state
server - -> storage : local file storage
worker - -> storage : blueprints and certificates
server - -> app_provider : IdP protocol endpoints
outposts - -> server : outpost communication
outposts - -> app_provider : protect / expose apps
monitoring ..> server : health and readiness
monitoring ..> worker : worker checks
monitoring ..> outposts : outpost checks
monitoring ..> metrics : Prometheus scrape

note right of proxy
Accept proxy headers only from trusted proxy CIDRs.
Use modern TLS and disable protocols older than TLS 1.3 where feasible.
end note

note bottom of db
Back up PostgreSQL before upgrades and on a recurring schedule.
end note

note bottom of worker
The default Compose file mounts the Docker socket for automatic outpost management.
Use a socket proxy or manual outpost deployment when reducing socket exposure.
end note

@enduml

