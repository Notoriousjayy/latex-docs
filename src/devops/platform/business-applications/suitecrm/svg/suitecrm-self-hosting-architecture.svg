-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="596.0375"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="615.1054"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="402" x="5" y="634.1733">!unquoted procedure UML_NOTE_INFO($id, $target, $text)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="93" x="9" y="653.2413">Syntax Error?</text><!--MD5=[35deb8204284a1372e37b2425177c1b7]
@startuml








skinparam backgroundColor      transparent
skinparam shadowing            false
skinparam roundCorner          6
skinparam padding              4
skinparam defaultTextAlignment center
skinparam wrapWidth            220
skinparam maxMessageSize       180

skinparam defaultFontName      "Helvetica"
skinparam defaultFontSize      12
skinparam defaultFontColor     #2D2D2D

skinparam titleFontName        "Helvetica"
skinparam titleFontSize        16
skinparam titleFontColor       #1F3B73
skinparam titleFontStyle       bold

skinparam captionFontName      "Helvetica"
skinparam captionFontSize      10
skinparam captionFontColor     #6E6E6E
skinparam captionFontStyle     italic

skinparam ArrowColor           #2D2D2D
skinparam ArrowFontColor       #2D2D2D
skinparam ArrowFontSize        11
skinparam ArrowThickness       1

skinparam NoteBackgroundColor  #F7F7F2
skinparam NoteBorderColor      #B8B8B0
skinparam NoteFontColor        #2D2D2D
skinparam NoteFontSize         11

skinparam LegendBackgroundColor #F7F7F2
skinparam LegendBorderColor     #B8B8B0
skinparam LegendFontColor       #2D2D2D
skinparam LegendFontSize        10

skinparam StereotypeFontSize       10
skinparam StereotypeFontStyle      italic
skinparam StereotypeFontColor      #6E6E6E


!unquoted procedure UML_NOTE_INFO($id, $target, $text)
note right of $target as $id ##F7F7F2
  $text
end note
!endprocedure

!unquoted procedure UML_NOTE_WARN($id, $target, $text)
note right of $target as $id #FBE9E0
  <color:#B5471F><b>!</b></color> $text
end note
!endprocedure

!unquoted procedure UML_CAPTION($text)
caption $text
!endprocedure



!unquoted procedure UML_DIVIDER($text)
== $text ==
!endprocedure







skinparam class {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  HeaderBackgroundColor #1F3B73
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
  RoundCorner       6
}

skinparam object {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  AttributeFontColor #2D2D2D
  AttributeFontSize 11
  StereotypeFontColor #6E6E6E
}

skinparam component {
  BackgroundColor   #F7F7F2
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam interface {
  BackgroundColor   #F7F7F2
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
}

skinparam node {
  BackgroundColor   #ECEEE8
  BorderColor       #1F3B73
  FontColor         #2D2D2D
}

skinparam package {
  BackgroundColor   #ECEEE8
  BorderColor       #4A6FA5
  FontColor         #2D2D2D
  Style             rectangle
}

skinparam rectangle {
  BackgroundColor   #F7F7F2
  BorderColor       #B8B8B0
  FontColor         #2D2D2D
}


!unquoted procedure STRUCT_GENERALIZATION($child, $parent)
$child - -|> $parent
!endprocedure

!unquoted procedure STRUCT_REALIZATION($class, $iface)
$class ..|> $iface
!endprocedure

!unquoted procedure STRUCT_DEPENDENCY($client, $supplier, $label="")
$client ..> $supplier : $label
!endprocedure

!unquoted procedure STRUCT_ASSOCIATION($a, $b, $label="")
$a - - $b : $label
!endprocedure

!unquoted procedure STRUCT_NAVIGABLE($a, $b, $label="")
$a - -> $b : $label
!endprocedure

!unquoted procedure STRUCT_AGGREGATION($whole, $part, $label="")
$whole o- - $part : $label
!endprocedure

!unquoted procedure STRUCT_COMPOSITION($whole, $part, $label="")
$whole *- - $part : $label
!endprocedure







!unquoted procedure STRUCT_LAYOUT_LR()
left to right direction
!endprocedure

!unquoted procedure STRUCT_LAYOUT_TB()
top to bottom direction
!endprocedure





skinparam node {
  RoundCorner 4
}
skinparam artifact {
  BackgroundColor #F7F7F2
  BorderColor     #4A6FA5
  FontColor       #2D2D2D
}

!unquoted procedure DEPLOY_DEVICE($name, $label)
node "$label" as $name <<device>>
!endprocedure

!unquoted procedure DEPLOY_EXECENV($name, $label)
node "$label" as $name <<executionEnvironment>>
!endprocedure

!unquoted procedure DEPLOY_ARTIFACT($name, $label)
artifact "$label" as $name
!endprocedure

!unquoted procedure DEPLOY_COMMPATH($a, $b, $label="")
$a - - $b : $label
!endprocedure





title SuiteCRM Self-Hosting Architecture

actor "CRM Users" as Users
actor "CRM Administrators" as Admins

cloud "Internet / Corporate Network" as Net

node "Public Edge" as Edge {
  rectangle "DNS\ncrm.example.com" as DNS
  rectangle "TLS / HTTPS\nCertificate + Redirect" as TLS
}

node "SuiteCRM Application Host" as AppHost {
  rectangle "Apache 2.4 vHost\nDocumentRoot: /var/www/suitecrm/public" as Apache
  rectangle "PHP Runtime\nPHP 8.2-8.4\nRequired Extensions" as PHP
  component "SuiteCRM Application" as SuiteCRM
  folder "public/" as Public
  folder "custom/" as Custom
  folder "uploads / cache / logs" as Files
  component "API Layer\nApi/ and Api/V8/" as API
  component "Scheduler Command\n./bin/console schedulers:run" as Scheduler
}

database "MariaDB / MySQL" as DB
node "Backup Target" as Backup {
  database "DB Dumps / Snapshots" as DBDump
  folder "File Archives" as FileArchive
}

node "Operations" as Ops {
  rectangle "Monitoring\nUptime, disk, DB, logs" as Monitoring
  rectangle "Patch / Upgrade Process" as Patching
  rectangle "Restore Test Environment" as Restore
}

Users - -> Net
Admins - -> Net
Net - -> DNS
DNS - -> TLS
TLS - -> Apache : HTTPS
Apache - -> Public : serves public web root
Apache - -> PHP : PHP execution
PHP - -> SuiteCRM
SuiteCRM - -> API
SuiteCRM - -> Files : uploads, cache, logs
SuiteCRM - -> Custom : extensions/customizations
SuiteCRM - -> DB : CRM data and metadata
Scheduler - -> SuiteCRM : recurring jobs
Scheduler - -> DB : workflow/email/report/index state
DB - -> DBDump : backup
Files - -> FileArchive : backup
DBDump - -> Restore : restore test
FileArchive - -> Restore : restore test
Monitoring - -> Apache
Monitoring - -> PHP
Monitoring - -> DB
Monitoring - -> Scheduler
Patching - -> AppHost
Patching - -> DB

note right of Apache
Official SuiteCRM webserver setup recommends
pointing the vhost to the public directory.
Do not expose the full SuiteCRM root.
end note

note bottom of Scheduler
Run scheduler as an allowed non-root user.
Do not run as root.
end note

note bottom of Backup
Production backup scope = database + files + config.
Restore testing is the acceptance criterion.
end note

@enduml

