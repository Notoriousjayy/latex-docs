# .github/actions/setup-latex/action.yml
name: 'Setup LaTeX Environment'
description: 'Install the TeX toolchain required by the canonical Makefile build contract'

inputs:
  extra-packages:
    description: 'Additional apt packages to install (space-separated)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install TeX Live and Python dependencies
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Installing TeX toolchain"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-pictures \
          texlive-science \
          texlive-bibtex-extra \
          texlive-plain-generic \
          texlive-luatex \
          texlive-xetex \
          latexmk \
          biber \
          python3-pygments \
          ghostscript \
          ${{ inputs.extra-packages }}
        echo "::endgroup::"

        sudo rm -rf /var/lib/apt/lists/* || true

    - name: Verify toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "=== LaTeX Environment Verification ==="
        echo "pdflatex:   $(which pdflatex) - $(pdflatex --version | head -1)"
        echo "latexmk:    $(which latexmk) - $(latexmk --version | head -1)"
        echo "pygmentize: $(which pygmentize) - $(pygmentize -V)"
        if ! kpsewhich binhex.tex >/dev/null; then
          echo "::error::binhex.tex not found on TEXMF path (needed by newtx)."
          exit 1
        fi
        if [[ ! -f /usr/bin/pygmentize ]]; then
          sudo ln -sf "$(which pygmentize)" /usr/bin/pygmentize 2>/dev/null || true
        fi