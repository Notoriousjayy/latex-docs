# .github/actions/setup-latex/action.yml
name: 'Setup LaTeX Environment'
description: 'Install the TeX toolchain required by the canonical Makefile build contract'

inputs:
  extra-packages:
    description: 'Additional apt packages to install (space-separated)'
    required: false
    default: ''
  skip-install:
    description: 'Skip provisioning (the job already runs in a prebuilt TeX image)'
    required: false
    default: 'false'
  cache-apt:
    description: 'Cache downloaded .deb archives between runs'
    required: false
    default: 'true'

outputs:
  toolchain-version:
    description: 'Identifier of the provisioned toolchain, for fingerprints and cache keys'
    value: ${{ steps.verify.outputs.toolchain-version }}

runs:
  using: 'composite'
  steps:
    # The TeX package set is the single largest fixed cost per shard runner.
    # Caching the downloaded archives removes the mirror round-trip; the
    # remaining cost is dpkg unpacking. For a further reduction, build the
    # pinned image in .github/docker/texlive and pass `container-image` to the
    # reusable workflow, which sets skip-install=true here.
    - name: Prepare apt archive cache directory
      if: ${{ inputs.skip-install != 'true' && inputs.cache-apt == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # The cache action runs as the unprivileged runner user, so it can only
        # extract into a directory it owns; /var/cache/apt/archives is root-owned.
        mkdir -p "${{ github.workspace }}/.apt-archive-cache"

    - name: Restore apt archive cache
      if: ${{ inputs.skip-install != 'true' && inputs.cache-apt == 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.apt-archive-cache
        key: apt-texlive-v3-${{ runner.os }}-${{ hashFiles('.github/actions/setup-latex/action.yml') }}
        restore-keys: |
          apt-texlive-v3-${{ runner.os }}-

    - name: Seed apt from the archive cache
      if: ${{ inputs.skip-install != 'true' && inputs.cache-apt == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cache_dir="${{ github.workspace }}/.apt-archive-cache"
        [[ -d "$cache_dir" ]] || exit 0
        count=$(find "$cache_dir" -maxdepth 1 -name '*.deb' -type f | wc -l)
        echo "Seeding apt with $count cached .deb archive(s)"
        if [[ "$count" -gt 0 ]]; then
          sudo install -d -m 0755 /var/cache/apt/archives
          find "$cache_dir" -maxdepth 1 -name '*.deb' -type f \
            -exec sudo install -m 0644 -o root -g root -t /var/cache/apt/archives {} +
        fi

    - name: Install TeX Live and Python dependencies
      if: ${{ inputs.skip-install != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Installing TeX toolchain"
        # Keep archives so the cache above stays populated for the next run.
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/99keep-downloads >/dev/null

        sudo apt-get update
        # cm-super must be listed explicitly: it is only a Recommends of
        # texlive-fonts-extra, so --no-install-recommends skips it. Without it,
        # T1-encoded Computer Modern resolves to bitmap EC/PK fonts and pdfTeX
        # aborts with "font expansion: auto expansion is only possible with
        # scalable fonts" wherever microtype expansion is active.
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          cm-super \
          texlive-pictures \
          texlive-science \
          texlive-bibtex-extra \
          texlive-plain-generic \
          texlive-luatex \
          texlive-xetex \
          latexmk \
          biber \
          python3-pygments \
          ghostscript \
          ${{ inputs.extra-packages }}
        echo "::endgroup::"

    - name: Harvest apt archives into the cache directory
      if: ${{ inputs.skip-install != 'true' && inputs.cache-apt == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cache_dir="${{ github.workspace }}/.apt-archive-cache"
        mkdir -p "$cache_dir"
        # Copy out, then take ownership: the post-job cache save reads as the
        # runner user, and the next restore must be able to overwrite these.
        find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -type f \
          -exec sudo cp -f -t "$cache_dir" {} + || true
        sudo chown -R "$(id -u):$(id -g)" "$cache_dir"
        chmod -R u+rw "$cache_dir"
        echo "Cached $(find "$cache_dir" -maxdepth 1 -name '*.deb' -type f | wc -l) .deb archive(s)"

    # TeX Live 2025 + Python 3.14 on Ubuntu 26.04 broke minted 3's
    # latexminted entry point. An installed .sty or pygmentize alone is not
    # proof that code highlighting works. Compile a real minted environment
    # before starting a sharded corpus build (also works with minted v2).
    - name: Smoke test minted syntax highlighting
      shell: bash
      run: |
        set -euo pipefail
        scratch="$(mktemp -d)"
        trap 'rm -rf "$scratch"' EXIT
        cat > "$scratch/minted-smoke.tex" <<'TEX'
        \documentclass{article}
        \usepackage{minted}
        \begin{document}
        \begin{minted}{python}
        print("CI minted smoke test")
        \end{minted}
        \end{document}
        TEX
        if ! (cd "$scratch" && pdflatex -shell-escape -interaction=nonstopmode -halt-on-error minted-smoke.tex >minted-smoke.stdout.txt 2>&1); then
          echo "::error::minted cannot execute its Python highlighting backend with this TeX/Python toolchain."
          tail -80 "$scratch/minted-smoke.stdout.txt"
          exit 1
        fi
        test -s "$scratch/minted-smoke.pdf" || {
          echo "::error::minted smoke test did not produce a PDF."
          exit 1
        }
        echo "minted syntax highlighting verified"

    - name: Verify toolchain
      id: verify
      shell: bash
      run: |
        set -euo pipefail
        echo "=== LaTeX Environment Verification ==="
        echo "pdflatex:   $(which pdflatex) - $(pdflatex --version | head -1)"
        echo "latexmk:    $(which latexmk) - $(latexmk --version | head -1)"
        echo "pygmentize: $(which pygmentize) - $(pygmentize -V)"
        if ! kpsewhich binhex.tex >/dev/null; then
          echo "::error::binhex.tex not found on TEXMF path (needed by newtx)."
          exit 1
        fi
        if ! kpsewhich sfrm1000.pfb >/dev/null; then
          echo "::error::cm-super Type 1 fonts not found (needed for scalable T1 Computer Modern with microtype expansion)."
          exit 1
        fi
        if [[ ! -f /usr/bin/pygmentize ]]; then
          sudo ln -sf "$(which pygmentize)" /usr/bin/pygmentize 2>/dev/null || true
        fi

        # A stable identifier for the compiling toolchain. It participates in
        # every root fingerprint and in cache keys, so a TeX Live upgrade
        # correctly invalidates cached results instead of silently reusing
        # PDFs produced by a different engine.
        version="$(pdflatex --version | head -1 | tr -cd '[:alnum:]._-')"
        echo "toolchain-version=$version" >> "$GITHUB_OUTPUT"
        echo "LATEX_TOOLCHAIN_VERSION=$version" >> "$GITHUB_ENV"
        echo "Toolchain version: $version"
