# .github/actions/build-documents/action.yml
name: 'Build LaTeX Documents'
description: 'Delegate LaTeX builds to the canonical Makefile/build-script contract'

inputs:
  mode:
    description: 'Build mode: shard, full, changed, publish, or category'
    required: false
    default: 'changed'
  plan:
    description: 'Path to a build plan JSON file (required when mode is shard)'
    required: false
    default: ''
  shard-index:
    description: 'Zero-based shard index within the plan (mode: shard)'
    required: false
    default: '0'
  category:
    description: 'Category name when mode is category'
    required: false
    default: ''
  jobs:
    description: 'Concurrent latexmk processes on this runner'
    required: false
    default: '4'
  base-ref:
    description: 'Base revision for changed-root builds'
    required: false
    default: ''
  head-ref:
    description: 'Head revision for changed-root builds'
    required: false
    default: ''
  clean-output:
    description: 'Reset the output/log trees before building'
    required: false
    default: 'true'

outputs:
  root-count:
    description: 'Number of selected roots for the current mode'
    value: ${{ steps.run.outputs.root-count }}
  attempted-count:
    description: 'Number of attempted document builds'
    value: ${{ steps.run.outputs.attempted-count }}
  success-count:
    description: 'Number of successful document builds'
    value: ${{ steps.run.outputs.success-count }}
  failure-count:
    description: 'Number of failed document builds'
    value: ${{ steps.run.outputs.failure-count }}
  pdf-count:
    description: 'Number of PDFs built'
    value: ${{ steps.run.outputs.pdf-count }}
  log-count:
    description: 'Number of log files generated'
    value: ${{ steps.run.outputs.log-count }}
  wall-clock-seconds:
    description: 'Wall-clock duration of the compilation phase'
    value: ${{ steps.run.outputs.wall-clock-seconds }}
  compile-seconds:
    description: 'Sum of per-document compilation durations'
    value: ${{ steps.run.outputs.compile-seconds }}
  has-pdfs:
    description: 'Whether valid current PDFs were produced'
    value: ${{ steps.run.outputs.has-pdfs }}
  has-logs:
    description: 'Whether log artifacts exist'
    value: ${{ steps.run.outputs.has-logs }}
  build-status:
    description: 'Normalized build status (success, failed, invalid)'
    value: ${{ steps.run.outputs.build-status }}

runs:
  using: 'composite'
  steps:
    - name: Run canonical build target
      id: run
      shell: bash
      run: |
        set -uo pipefail
        cd "${GITHUB_WORKSPACE}"
        mkdir -p public/pdfs public/logs

        make_args=(
          OUTPUT_DIR=public/pdfs
          LOG_DIR=public/logs
          JOBS="${{ inputs.jobs }}"
          MODE_NAME="${{ inputs.mode }}"
          BASE_REF="${{ inputs.base-ref }}"
          HEAD_REF="${{ inputs.head-ref }}"
        )
        if [[ "${{ inputs.clean-output }}" == "true" ]]; then
          make_args+=(CLEAN_OUTPUT=true)
        fi

        # Capture the build status without aborting so the outputs below are
        # always emitted before the step propagates the original exit code.
        set +e
        case "${{ inputs.mode }}" in
          shard)
            if [[ -z "${{ inputs.plan }}" ]]; then
              echo "::error::shard mode requires a plan file"
              exit 2
            fi
            make build-shard \
              PLAN="${{ inputs.plan }}" \
              SHARD_INDEX="${{ inputs.shard-index }}" \
              "${make_args[@]}"
            ;;
          full)
            make build-parallel "${make_args[@]}"
            ;;
          changed)
            make build-changed "${make_args[@]}"
            ;;
          publish)
            make publish-parallel "${make_args[@]}"
            ;;
          category)
            if [[ -z "${{ inputs.category }}" ]]; then
              echo "::error::category mode requires a non-empty category"
              exit 2
            fi
            make "build-category-${{ inputs.category }}" "${make_args[@]}"
            ;;
          *)
            echo "::error::Unsupported mode: ${{ inputs.mode }}"
            exit 2
            ;;
        esac
        build_status_code=$?
        set -e

        python3 - "$build_status_code" >> "$GITHUB_OUTPUT" <<'PY'
        import json
        import sys
        from pathlib import Path

        exit_code = int(sys.argv[1])
        summary_path = Path('public/logs/build-summary.json')
        pdf_dir = Path('public/pdfs')

        if summary_path.is_file():
            summary = json.loads(summary_path.read_text(encoding='utf-8'))
        else:
            summary = {
                'pdf_count': sum(1 for _ in pdf_dir.rglob('*.pdf')) if pdf_dir.is_dir() else 0,
                'build_status': {0: 'success', 1: 'failed'}.get(exit_code, 'invalid'),
            }

        pdf_count = int(summary.get('pdf_count', 0))
        print(f"root-count={summary.get('root_count', 0)}")
        print(f"attempted-count={summary.get('attempted_count', 0)}")
        print(f"success-count={summary.get('succeeded_count', 0)}")
        print(f"failure-count={summary.get('failed_count', 0)}")
        print(f"pdf-count={pdf_count}")
        print(f"log-count={summary.get('log_count', 0)}")
        print(f"wall-clock-seconds={summary.get('wall_clock_seconds', 0)}")
        print(f"compile-seconds={summary.get('compile_seconds', 0)}")
        print(f"has-pdfs={'true' if pdf_count > 0 else 'false'}")
        print(f"has-logs={'true' if summary_path.is_file() else 'false'}")
        print(f"build-status={summary.get('build_status', 'invalid')}")
        PY

        exit "$build_status_code"
