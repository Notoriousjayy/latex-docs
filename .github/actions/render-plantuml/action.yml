# .github/actions/render-plantuml/action.yml
name: 'Render PlantUML Diagrams'
description: 'Render PlantUML diagrams through the repository-owned tooling contract'

inputs:
  source-dir:
    description: 'Root directory to search for .puml files'
    required: false
    default: 'src'
  formats:
    description: 'Space-separated output formats (png svg jpg)'
    required: false
    default: 'png svg'
  generate-jpg:
    description: 'Generate JPG from PNG (requires ImageMagick)'
    required: false
    default: 'false'
  fail-on-error:
    description: 'Fail the action if any diagram fails to render'
    required: false
    default: 'true'
  config-names:
    description: 'Space-separated config file names to search for'
    required: false
    default: 'plantuml-config.puml config.puml'
  plantuml-version:
    description: 'Must match tooling/manifests/plantuml.json; the manifest is the single pin (leave empty)'
    required: false
    default: ''

outputs:
  diagram-count:
    description: 'Number of PlantUML source files found'
    value: ${{ steps.render.outputs.diagram_count }}
  rendered-count:
    description: 'Number of output files successfully rendered'
    value: ${{ steps.render.outputs.rendered_count }}
  failed-count:
    description: 'Number of render failures'
    value: ${{ steps.render.outputs.failed_count }}
  skipped-count:
    description: 'Number of include-only PUML fragments skipped'
    value: ${{ steps.render.outputs.skipped_count }}
  rendered-files:
    description: 'JSON array of rendered file paths'
    value: ${{ steps.render.outputs.files }}
  has-changes:
    description: 'Whether any new files were generated'
    value: ${{ steps.render.outputs.has_changes }}

runs:
  using: 'composite'
  steps:
    - name: Install PlantUML and dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Installing PlantUML dependencies"
        # Graphviz and Java intentionally follow the Ubuntu runner packages;
        # the PlantUML jar is the pinned, repository-controlled renderer.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates \
          graphviz \
          default-jre-headless
        if [[ "${{ inputs.generate-jpg }}" == "true" ]]; then
          sudo apt-get install -y --no-install-recommends imagemagick
        fi
        sudo rm -rf /var/lib/apt/lists/*
        PINNED="$(python3 -c 'import json; print(json.load(open("tooling/manifests/plantuml.json"))["version"])')"
        REQUESTED="${{ inputs.plantuml-version }}"
        if [[ -n "$REQUESTED" && "${REQUESTED#v}" != "$PINNED" ]]; then
          echo "::error::plantuml-version '$REQUESTED' does not match the pinned $PINNED in tooling/manifests/plantuml.json; bump the manifest instead"
          exit 1
        fi
        # Same download + sha256 check that `make render-plantuml` uses locally.
        PLANTUML_JAR="$(python3 tooling/scripts/latex_build.py fetch-plantuml --dest "$RUNNER_TEMP/plantuml-$PINNED.jar")"
        echo "PLANTUML_JAR=$PLANTUML_JAR" >> "$GITHUB_ENV"
        echo "::endgroup::"
        java -Djava.awt.headless=true -jar "$PLANTUML_JAR" -version 2>&1 | head -3
    - name: Render PlantUML diagrams
      id: render
      shell: bash
      run: |
        set -euo pipefail
        ROOT="${{ inputs.source-dir }}"
        read -ra FORMATS <<< "${{ inputs.formats }}"
        if [[ "${{ inputs.generate-jpg }}" == "true" ]]; then
          FORMATS+=("jpg")
        fi
        FAIL_ON_ERROR="${{ inputs.fail-on-error }}"
        if [[ ! -d "$ROOT" ]]; then
          echo "diagram_count=0" >> "$GITHUB_OUTPUT"
          echo "rendered_count=0" >> "$GITHUB_OUTPUT"
          echo "failed_count=0" >> "$GITHUB_OUTPUT"
          echo "skipped_count=0" >> "$GITHUB_OUTPUT"
          echo 'files=[]' >> "$GITHUB_OUTPUT"
          echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        export PLANTUML_INCLUDE_PATH="${GITHUB_WORKSPACE}/tooling/plantuml:${GITHUB_WORKSPACE}/tooling/styles/plantuml"
        set +e
        python3 tooling/scripts/latex_build.py render-plantuml --source-dir "$ROOT" --formats "${FORMATS[@]}"
        render_status=$?
        set -e
        diagram_count=$(find "$ROOT" -type f -name '*.puml' 2>/dev/null | wc -l | tr -d ' ')
        rendered_count=$(find "$ROOT" -type f \( -name '*.png' -o -name '*.svg' -o -name '*.jpg' -o -name '*.jpeg' \) 2>/dev/null | wc -l | tr -d ' ')
        failed_count=0
        skipped_count=0
        if [[ "$render_status" -ne 0 ]]; then
          failed_count=$((failed_count + 1))
        fi
        if [[ "$FAIL_ON_ERROR" != "true" ]]; then
          echo "::warning::PlantUML rendering completed with non-zero exit status; continuing because fail-on-error=false"
        fi
        python3 - "$ROOT" <<'PY'
        import json, sys
        from pathlib import Path
        root = Path(sys.argv[1]).resolve()
        files = sorted(str(path.relative_to(root).as_posix()) for path in root.rglob('*') if path.is_file() and path.suffix.lower() in {'.png', '.svg', '.jpg', '.jpeg'})
        print(f"files={json.dumps(files)}")
        PY
        files_json=$(python3 - "$ROOT" <<'PY'
        import json, sys
        from pathlib import Path
        root = Path(sys.argv[1]).resolve()
        files = sorted(str(path.relative_to(root).as_posix()) for path in root.rglob('*') if path.is_file() and path.suffix.lower() in {'.png', '.svg', '.jpg', '.jpeg'})
        print(json.dumps(files))
        PY
        )
        echo "diagram_count=$diagram_count" >> "$GITHUB_OUTPUT"
        echo "rendered_count=$rendered_count" >> "$GITHUB_OUTPUT"
        echo "failed_count=$failed_count" >> "$GITHUB_OUTPUT"
        echo "skipped_count=$skipped_count" >> "$GITHUB_OUTPUT"
        echo "files=${files_json}" >> "$GITHUB_OUTPUT"
        echo "has_changes=true" >> "$GITHUB_OUTPUT"
        if [[ "$FAIL_ON_ERROR" == "true" && "$render_status" -ne 0 ]]; then
          exit "$render_status"
        fi



