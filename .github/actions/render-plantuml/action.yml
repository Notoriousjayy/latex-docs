# .github/actions/render-plantuml/action.yml
name: 'Render PlantUML Diagrams'
description: 'Render PlantUML diagrams through the repository-owned tooling contract'

inputs:
  source-dir:
    description: 'Root directory to search for .puml files'
    required: false
    default: 'src'
  formats:
    description: 'Space-separated output formats (png svg jpg)'
    required: false
    default: 'png svg'
  generate-jpg:
    description: 'Generate JPG from PNG (requires ImageMagick)'
    required: false
    default: 'false'
  extra-roots:
    description: 'Space-separated additional first-party diagram roots (e.g. tooling/plantuml for the framework examples)'
    required: false
    default: 'tooling/plantuml'
  force:
    description: 'Re-render every diagram regardless of freshness'
    required: false
    default: 'false'
  result-path:
    description: 'Where the renderer writes its JSON result'
    required: false
    default: 'public/logs/plantuml-render.json'
  plantuml-version:
    description: 'Must match tooling/manifests/plantuml.json; the manifest is the single pin (leave empty)'
    required: false
    default: ''

outputs:
  discovered-files:
    description: 'Number of .puml files discovered (diagrams + configs + include-only fragments)'
    value: ${{ steps.render.outputs.discovered_files }}
  diagram-count:
    description: 'Number of renderable diagram sources'
    value: ${{ steps.render.outputs.diagram_count }}
  diagram-blocks:
    description: 'Number of @startuml blocks across those sources'
    value: ${{ steps.render.outputs.diagram_blocks }}
  rendered-count:
    description: 'Diagrams rendered in this run (all requested formats validated and promoted)'
    value: ${{ steps.render.outputs.rendered_count }}
  reused-count:
    description: 'Diagrams whose outputs were already current'
    value: ${{ steps.render.outputs.reused_count }}
  failed-count:
    description: 'Diagrams that failed (previous images preserved, reported as failed)'
    value: ${{ steps.render.outputs.failed_count }}
  skipped-count:
    description: 'Include-only .puml fragments skipped'
    value: ${{ steps.render.outputs.skipped_count }}
  output-files:
    description: 'Per-format output files written this run'
    value: ${{ steps.render.outputs.output_files }}
  outputs-by-format:
    description: 'JSON object of output counts per format'
    value: ${{ steps.render.outputs.outputs_by_format }}
  rendered-files:
    description: 'JSON array of repo-relative image paths whose bytes changed'
    value: ${{ steps.render.outputs.files }}
  has-changes:
    description: 'Whether any image bytes actually changed'
    value: ${{ steps.render.outputs.has_changes }}
  result-path:
    description: 'Path of the authoritative JSON render result'
    value: ${{ steps.render.outputs.result_path }}

runs:
  using: 'composite'
  steps:
    - name: Install PlantUML and dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Installing PlantUML dependencies"
        # Graphviz, Java and ImageMagick intentionally follow the Ubuntu runner
        # packages; the PlantUML jar is the pinned, repository-controlled
        # renderer. ImageMagick is unconditional because the renderer refreshes
        # managed JPGs when PNG output is requested, preserving the full output
        # matrix even when generate-jpg is false.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates \
          graphviz \
          fonts-dejavu-core \
          imagemagick \
          default-jre-headless
        sudo rm -rf /var/lib/apt/lists/*
        PINNED="$(python3 -c 'import json; print(json.load(open("tooling/manifests/plantuml.json"))["version"])')"
        REQUESTED="${{ inputs.plantuml-version }}"
        if [[ -n "$REQUESTED" && "${REQUESTED#v}" != "$PINNED" ]]; then
          echo "::error::plantuml-version '$REQUESTED' does not match the pinned $PINNED in tooling/manifests/plantuml.json; bump the manifest instead"
          exit 1
        fi
        # Same download + sha256 check that `make render-plantuml` uses locally.
        PLANTUML_JAR="$(python3 tooling/scripts/latex_build.py fetch-plantuml --dest "$RUNNER_TEMP/plantuml-$PINNED.jar")"
        echo "PLANTUML_JAR=$PLANTUML_JAR" >> "$GITHUB_ENV"
        echo "::endgroup::"
        java -Djava.awt.headless=true -jar "$PLANTUML_JAR" -version 2>&1 | head -3
    - name: Render PlantUML diagrams
      id: render
      shell: bash
      run: |
        set -euo pipefail
        ROOT="${{ inputs.source-dir }}"
        read -ra FORMATS <<< "${{ inputs.formats }}"
        if [[ "${{ inputs.generate-jpg }}" == "true" ]]; then
          FORMATS+=("jpg")
        fi
        EXTRA=()
        for root in ${{ inputs.extra-roots }}; do EXTRA+=(--extra-root "$root"); done
        FORCE=()
        if [[ "${{ inputs.force }}" == "true" ]]; then FORCE+=(--force); fi
        RESULT="${{ inputs.result-path }}"
        mkdir -p "$(dirname "$RESULT")"
        # The renderer is the single source of discovery, freshness, validation and
        # accounting; the action only relays its JSON result. It exits 1 on any failed
        # diagram (previous valid images are preserved and reported as failed) and 2 on
        # a configuration error such as an unpinned engine. An expected root that holds
        # no renderable diagram is a failure, never a silent "0 rendered" success.
        set +e
        python3 tooling/scripts/latex_build.py render-plantuml \
          --source-dir "$ROOT" "${EXTRA[@]}" --formats "${FORMATS[@]}" "${FORCE[@]}" \
          --result "$RESULT" --require-diagrams
        status=$?
        set -e
        if [[ -f "$RESULT" ]]; then
          python3 tooling/scripts/latex_build.py plantuml-render-outputs --result "$RESULT" >> "$GITHUB_OUTPUT"
          python3 tooling/scripts/latex_build.py plantuml-render-outputs --result "$RESULT" --emit summary >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::error::renderer produced no result file at $RESULT"
          exit 1
        fi
        echo "result_path=$RESULT" >> "$GITHUB_OUTPUT"
        exit "$status"
