name: LaTeX CI

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: 'Build mode: changed or full'
        type: choice
        default: 'changed'
        options:
          - changed
          - full
  pull_request:
    paths:
      - 'src/**/*.tex'
      - 'src/**/*.puml'
      - 'tooling/**/*.sty'
      - 'tooling/**/*.tex'
      - 'tooling/**/*.iuml'
      - 'tooling/scripts/**'
      - 'Makefile'
      - 'latexmkrc'
      - '.github/actions/**'
      - '.github/workflows/_build-latex.yml'
  push:
    branches: [main]
    paths:
      - 'src/**/*.tex'
      - 'src/**/*.puml'
      - 'tooling/**/*.sty'
      - 'tooling/**/*.tex'
      - 'tooling/**/*.iuml'
      - 'tooling/scripts/**'
      - 'Makefile'
      - 'latexmkrc'
      - '.github/actions/**'
      - '.github/workflows/_build-latex.yml'

permissions:
  contents: read

concurrency:
  group: latex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build-latex.yml
    with:
      build-mode: ${{ github.event_name == 'workflow_dispatch' && inputs.build-mode || 'changed' }}
      base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      upload-artifacts: true
      render-plantuml: true
