name: Computer Security Engineering Labs
on:
  pull_request:
    paths:
      - 'src/security/computer-security-art-and-science/**'
      - '.github/workflows/bishop-security-labs.yml'
  push:
    branches: [main]
    paths:
      - 'src/security/computer-security-art-and-science/**'
      - '.github/workflows/bishop-security-labs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bishop-security-labs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hermetic-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python security model tests
        run: python3 -m unittest discover -s src/security/computer-security-art-and-science/examples/python -p 'test_*.py' -v
      - name: C99 bounded-copy checks
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror src/security/computer-security-art-and-science/examples/c/checked_copy.c -o /tmp/ces-checked-copy
          /tmp/ces-checked-copy
      - name: C++17 authorization checks
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror src/security/computer-security-art-and-science/examples/cpp/object_authorization.cpp -o /tmp/ces-object-auth
          /tmp/ces-object-auth
