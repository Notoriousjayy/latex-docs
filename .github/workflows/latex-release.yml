name: LaTeX Release

# Releases promote artifacts rather than recompiling.
#
# If the authoritative Pages build already produced a verified corpus for the
# exact release commit, that artifact is reused. Only when no artifact can be
# proven to correspond to the release commit does a full rebuild occur.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: latex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  locate:
    name: Locate verified artifact
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
      found: ${{ steps.find.outputs.found }}
    steps:
      - name: Find an authoritative build for this exact commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/latex-pages.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"

          if [[ -n "$run_id" ]] && gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '.artifacts[].name' | grep -qx 'latex-pdfs'; then
            echo "Reusing verified corpus from run ${run_id} for ${GITHUB_SHA}."
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No verified corpus found for ${GITHUB_SHA}; a rebuild is required."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

  rebuild:
    name: Rebuild
    needs: locate
    if: ${{ needs.locate.outputs.found != 'true' }}
    uses: ./.github/workflows/_build-latex.yml
    with:
      build-mode: full
      max-shards: 12
      max-parallel-shards: 12
      local-build-jobs: 4
      publish: true
      render-plantuml: true

  release:
    needs: [locate, rebuild]
    if: ${{ always() && needs.locate.result == 'success' && (needs.locate.outputs.found == 'true' || needs.rebuild.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified corpus from the authoritative build
        if: ${{ needs.locate.outputs.found == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: latex-pdfs
          path: pdfs
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download freshly rebuilt corpus
        if: ${{ needs.locate.outputs.found != 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: latex-pdfs
          path: pdfs

      - name: Create release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          count="$(find pdfs -name '*.pdf' | wc -l)"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::Refusing to publish an empty release archive."
            exit 1
          fi
          (cd pdfs && zip -qr ../dist/latex-pdfs-all.zip . -i '*.pdf')
          echo "Archived ${count} PDFs" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach archive to release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
