name: Import Algorithm Engineering source suite (one-time)

on:
  push:
    branches:
      - docs/algorithm-engineering-suite-20261029
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Extract validated source-only package
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/algorithm-suite-import.b64 > "${RUNNER_TEMP}/algorithm-suite-import.tar.xz"
          tar -tJf "${RUNNER_TEMP}/algorithm-suite-import.tar.xz" > "${RUNNER_TEMP}/algorithm-suite-files.txt"
          grep -q '^src/programming/algorithms/algorithm-engineering/' "${RUNNER_TEMP}/algorithm-suite-files.txt"
          tar -xJf "${RUNNER_TEMP}/algorithm-suite-import.tar.xz" -C . --no-same-owner --no-same-permissions
          test -f src/programming/algorithms/algorithm-engineering/README.md
          test -f src/programming/algorithms/algorithm-engineering/scripts/validate-algorithm-suite.py
          # Fix a verified temporary-container lifetime error in the C++ test.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/programming/algorithms/algorithm-engineering/code/cpp/tests/test_algorithms.cpp')
          s=p.read_text()
          old='    auto sols=alg::exact_cover({1,2,3,4},{{1,2},{3,4},{1,3},{2,4}});'
          assert old in s
          s=s.replace(old,'    const std::vector<std::set<int>> options={{1,2},{3,4},{1,3},{2,4}};\n    auto sols=alg::exact_cover({1,2,3,4},options);')
          old='std::vector<std::set<int>>{{1,2},{3,4},{1,3},{2,4}}[ix]'
          assert old in s
          s=s.replace(old,'options.at(ix)')
          p.write_text(s)
          PY
          if find src/programming/algorithms/algorithm-engineering -name '*.pdf' | grep -q .; then
            echo 'Unexpected compiled PDFs in source import' >&2; exit 1
          fi
      - name: Verify source inventory and executable algorithms
        shell: bash
        run: |
          set -euo pipefail
          suite=src/programming/algorithms/algorithm-engineering
          python3 "${suite}/scripts/validate-algorithm-suite.py"
          bash "${suite}/scripts/test-algorithm-code.sh"
      - name: Commit imported source and delete temporary import mechanism
        shell: bash
        run: |
          set -euo pipefail
          suite=src/programming/algorithms/algorithm-engineering
          rm -f "${suite}/code/c/alg_c_tests"
          sed -i 's/[[:blank:]]\+$//' "${suite}/VALIDATION_REPORT.md"
          find "${suite}" -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/algorithm-suite-import.b64 .github/workflows/algorithm-suite-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${suite}"
          git add -u .github/algorithm-suite-import.b64 .github/workflows/algorithm-suite-import.yml
          git diff --cached --check
          git commit -m "docs(algorithms): integrate Knuth-aligned algorithm engineering suite"
          git push origin HEAD:docs/algorithm-engineering-suite-20261029
