name: AppSec Governance Offline Tests

# Synthetic input only. This workflow has no API mutation, environment secrets,
# elevated tokens, production deployment, or alert dismissal authority.
on:
  pull_request:
    paths:
      - 'src/security/github-advanced-security/code-scanning/enterprise-triage-governance/**'
      - 'tests/test_enterprise_appsec_governance.py'
      - '.github/workflows/appsec-governance-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-policy-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository (reviewed immutable action)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify offline Python policy and security contracts
        run: python3 -m unittest discover -s tests -p 'test_enterprise_appsec_governance.py' -v
