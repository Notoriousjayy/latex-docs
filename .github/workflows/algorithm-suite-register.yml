name: Register Algorithm Engineering sources and navigation (one-time)

on:
  push:
    branches:
      - docs/algorithm-engineering-suite-20261029
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Register semantic sources and Template-Blank governance
        shell: bash
        run: |
          set -euo pipefail
          test -f src/programming/algorithms/algorithm-engineering/README.md
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          base=Path('src/programming/algorithms/algorithm-engineering')
          source_prefix='src/programming/algorithms/algorithm-engineering/'
          semantic=Path('tooling/manifests/semantic-document-inventory.json')
          inventory=json.loads(semantic.read_text())
          known={e['path'] for e in inventory['sources']}
          families={
            'technical-references':'technical-reference',
            'study-guides':'study-guide',
            'curricula':'curriculum',
            'laboratories':'laboratory',
            'workbooks':'workbook',
            'procedures':'procedure',
            'templates':'template',
            'blank':'blank-form',
            'shared':'latex-fragment',
          }
          added=0
          for path in sorted(base.rglob('*.tex')):
              rel=path.as_posix()
              if rel in known:
                  continue
              family=path.parent.name
              kind=families[family]
              blob=subprocess.check_output(['git','hash-object',rel],text=True).strip()
              content=path.read_text(encoding='utf-8')
              inventory['sources'].append({
                  'id':'doc-'+hashlib.sha1(rel.encode()).hexdigest()[:12],
                  'path':rel,
                  'blob_sha':blob,
                  'domain':'programming',
                  'primary_subject':'algorithm engineering / '+family.replace('-',' '),
                  'title':path.stem.replace('-',' ').title(),
                  'primary_type':kind,
                  'secondary_types':[],
                  'intended_use':'not reviewed',
                  'audience':'not reviewed',
                  'summary':None,
                  'review_status':'path-inferred-not-fully-reviewed',
                  'confidence':'provisional',
                  'bytes':path.stat().st_size,
                  'content_search_mentions':{
                      'user_stories':bool(re.search(r'user stories',content,re.I)),
                      'scorecard':bool(re.search(r'scorecard',content,re.I)),
                      'workbook':bool(re.search(r'workbook',content,re.I)),
                  },
                  'standalone_latex':kind!='latex-fragment',
              })
              added+=1
          inventory['sources'].sort(key=lambda e:e['path'])
          inventory['document_count']=len(inventory['sources'])
          inventory['reviewed_items']=sum(e.get('review_status')=='targeted-content-reviewed' for e in inventory['sources'])
          semantic.write_text(json.dumps(inventory,ensure_ascii=False,indent=2)+'\n')
          assert added==34,(added,len(inventory['sources']))

          pairs_file=Path('tooling/manifests/reusable-artifact-pairs.json')
          registered=json.loads(pairs_file.read_text())
          ids={e['id'] for e in registered['pairs']}
          new_pairs=[]
          templates=list(sorted((base/'templates').glob('*-template.tex')))
          workbooks=list(sorted((base/'workbooks').glob('*.tex')))
          for source in templates+workbooks:
              name=source.stem
              if source.parent.name=='templates':
                  blank=base/'blank'/(name.replace('-template','-blank')+'.tex')
                  family='algorithm-assessment'
              else:
                  blank=base/'blank'/(name+'-blank.tex')
                  family='algorithm-analysis-workbook'
              assert blank.exists(),blank
              identity='PROG-ALGO-'+re.sub(r'[^A-Z0-9]+','_',name.upper()).strip('_')
              row={'id':identity,'domain':'programming','family':family,
                   'template':source.as_posix(),'blank':blank.as_posix(),
                   'status':'COMPLETE_PAIR'}
              if identity not in ids:
                  registered['pairs'].append(row)
                  new_pairs.append(row)
          assert len(new_pairs)==9,len(new_pairs)
          registered['pairs'].sort(key=lambda e:e['id'])
          pairs_file.write_text(json.dumps(registered,ensure_ascii=False,indent=2)+'\n')
          pair_catalog=Path('catalog/template-blank-pairs.md')
          text=pair_catalog.read_text()
          if '## Algorithm Engineering registered pairs' not in text:
              section='\n## Algorithm Engineering registered pairs\n\n'
              section+='The nine Algorithm Engineering forms below have print-ready Blank companions and are registered in the machine-readable governance manifest.\n\n'
              section+='| Logical ID | Family | Template | Blank |\n|---|---|---|---|\n'
              for row in new_pairs:
                  section+='| '+row['id']+' | '+row['family']+' | ['+Path(row['template']).name+'](../'+row['template']+') | ['+Path(row['blank']).name+'](../'+row['blank']+') |\n'
              text+=section
          pair_catalog.write_text(text)
          print(f'Registered {added} .tex sources and {len(new_pairs)} Template-Blank pairs.')

          alg=Path('src/programming/algorithms/README.md')
          text=alg.read_text()
          if 'algorithm-engineering/README.md' not in text:
              text+='\n## Algorithm Engineering documentation suite\n\n'
              text+='[Algorithm Engineering and Computer Science Documentation Suite](algorithm-engineering/README.md) — 33 standalone LaTeX documents aligned with TAOCP Volumes 1–4B, original C11/C++20/Python laboratories, mathematical workbooks, benchmarking and verification procedures, and governed print-ready Template–Blank pairs.\n'
          alg.write_text(text)
          programming=Path('src/programming/README.md')
          text=programming.read_text()
          text=text.replace('| [algorithms](algorithms/README.md) | Algorithm design, analysis and implementation guidance. | 7 |',
                            '| [algorithms](algorithms/README.md) | Algorithm design, analysis and implementation guidance; Algorithm Engineering suite. | 41 |')
          programming.write_text(text)
          root=Path('README.md')
          text=root.read_text()
          if 'algorithm-engineering/README.md' not in text:
              marker='| Find secure coding standards by language |'
              new='| Study algorithm engineering across TAOCP Volumes 1–4B | [Algorithm Engineering suite](src/programming/algorithms/algorithm-engineering/README.md) |\n'
              assert marker in text
              text=text.replace(marker,new+marker,1)
          root.write_text(text)
          PY
          python3 tooling/scripts/build_semantic_catalogs.py --write
          python3 tooling/scripts/build_semantic_catalogs.py --check
          python3 src/programming/algorithms/algorithm-engineering/scripts/validate-algorithm-suite.py
      - name: Commit documentation navigation and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/algorithm-suite-register.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/programming/README.md src/programming/algorithms/README.md
          git add tooling/manifests/semantic-document-inventory.json tooling/manifests/reusable-artifact-pairs.json catalog/
          git add -u .github/workflows/algorithm-suite-register.yml
          git diff --cached --check
          git commit -m 'docs(catalog): register algorithm engineering sources and pairs'
          git push origin HEAD:docs/algorithm-engineering-suite-20261029
