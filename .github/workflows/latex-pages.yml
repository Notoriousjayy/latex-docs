name: Deploy PDFs to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**/*.tex'
      - 'src/**/*.puml'
      - 'tooling/**/*.sty'
      - 'tooling/**/*.tex'
      - 'tooling/**/*.iuml'
      - 'tooling/scripts/**'
      - 'Makefile'
      - 'latexmkrc'
      - '.github/actions/**'
      - '.github/workflows/_build-latex.yml'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build-latex.yml
    with:
      build-mode: publish
      jobs: 4
      upload-artifacts: true
      render-plantuml: true

  stage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download PDFs artifact
        uses: actions/download-artifact@v7
        with:
          name: latex-pdfs
          path: site/pdfs
      - name: Generate Pages index
        run: |
          set -euo pipefail
          mkdir -p site
          printf '<!doctype html><html><body><h1>LaTeX PDFs</h1><ul>' > site/index.html
          find site/pdfs -type f -name '*.pdf' | sort | while read -r pdf; do
            rel="${pdf#site/pdfs/}"
            printf '<li><a href="pdfs/%s">%s</a></li>' "$rel" "$rel" >> site/index.html
          done
          printf '</ul></body></html>' >> site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
