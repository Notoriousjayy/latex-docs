name: Native Grammar References CI

on:
  pull_request:
    paths:
      - 'src/programming/languages/syntax-diagrams/**'
      - 'tooling/scripts/generate_syntax_references.py'
      - 'tooling/scripts/generate_railroad_ebnf.py'
      - '.github/workflows/_build-latex.yml'
      - 'tooling/scripts/latex_build.py'
      - 'tests/test_syntax_diagram_collection.py'
      - 'tests/test_railroad_ebnf_generation.py'
      - 'tests/test_native_syntax_gallery.py'
      - 'tooling/scripts/stage_syntax_diagram_gallery.py'
      - 'tests/test_plantuml_pipeline.py'
      - '.github/workflows/native-grammar-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check deterministic LaTeX grammar fragments
        run: python3 tooling/scripts/generate_syntax_references.py --check
      - name: Verify complete native diagram source inventory
        run: python3 tooling/scripts/generate_railroad_ebnf.py --check-only
      - name: Verify grammar fidelity and complete static gallery
        run: python3 -m unittest -v tests.test_syntax_diagram_collection tests.test_native_syntax_gallery tests.test_railroad_ebnf_generation
      - name: Confirm pdfLaTeX-only policy
        run: make preflight

  render-smoke:
    name: Render native railroad PNG smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate two grammar diagrams per language
        run: python3 tooling/scripts/generate_railroad_ebnf.py --limit-per-language 2
      - name: Render sample grammar PNGs using the existing pinned engine
        uses: ./.github/actions/render-plantuml
        with:
          source-dir: 'src/programming/languages/syntax-diagrams/railroad-generated'
          extra-roots: ''
          formats: 'png'
          generate-jpg: 'false'
          force: 'true'
          result-path: '.build-cache/grammar-smoke-render.json'
      - name: Verify PNG signature and exact sample count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = list(Path('src/programming/languages/syntax-diagrams/railroad-generated').rglob('png/*.png'))
          assert len(paths) == 10, f'Expected 10 smoke PNGs, got {len(paths)}'
          for path in paths:
              with path.open('rb') as file:
                  assert file.read(8) == b'\x89PNG\r\n\x1a\n', path
          print('Rendered 10 valid PNG diagrams through pinned PlantUML')
          PY
