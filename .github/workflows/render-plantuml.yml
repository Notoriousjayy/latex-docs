name: Render PlantUML Diagrams

# Diagram regeneration is decoupled from LaTeX compilation.
#
# Rendered PNG/SVG output is committed to the repository, so ordinary document
# builds consume it directly and never pay for Java, Graphviz and PlantUML
# provisioning. This workflow only runs when diagram sources or diagram styles
# actually change.

on:
  workflow_dispatch:
    inputs:
      generate-jpg:
        description: 'Also generate JPG output'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**/*.puml'
      - 'src/**/*.iuml'
      - 'tooling/plantuml/**'
      - 'tooling/styles/plantuml/**'
      - '.github/actions/render-plantuml/**'
      - '.github/workflows/render-plantuml.yml'

permissions:
  contents: write

concurrency:
  group: render-plantuml-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render:
    # workflow_dispatch can be started from any ref; only main may be rendered
    # and pushed back onto main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint PlantUML style framework
        shell: bash
        run: python3 tooling/scripts/plantuml_lint.py

      - name: Render PlantUML diagrams
        uses: ./.github/actions/render-plantuml
        with:
          source-dir: 'src'
          formats: 'png svg'
          generate-jpg: ${{ inputs.generate-jpg && 'true' || 'false' }}
          fail-on-error: 'true'

      - name: Verify framework examples with the pinned engine
        shell: bash
        # Uses PLANTUML_JAR exported by the action; fails on exit status, missing
        # outputs, or error/deprecation text drawn into the SVG (NBSP-normalised).
        run: python3 tooling/scripts/latex_build.py smoke-plantuml --output-dir "$RUNNER_TEMP/plantuml-smoke"

      - name: Commit rendered images
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stages only src/**/{png,svg,jpg}/*.{png,svg,jpg} (adds, edits, deletions)
          # from concrete paths, so an absent optional format cannot abort the add.
          python3 tooling/scripts/latex_build.py stage-plantuml-images
          if git diff --cached --quiet; then
            echo 'No diagram changes to commit'
            exit 0
          fi
          # The resulting push re-triggers latex-pages.yml, whose dependency
          # analysis rebuilds exactly the documents consuming these diagrams.
          git commit -m 'chore(diagrams): render PlantUML images'
          git push origin HEAD:refs/heads/main
