name: Build CI Toolchain Image

# Publishes the pinned TeX toolchain image consumed by _build-latex.yml.
#
# This is an opt-in optimization: once an image tag is published, pass it as
# `container-image` from the caller workflows to replace per-shard apt
# provisioning with a single image pull.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. 2026.08.1). Never use "latest" for production CI.'
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - '.github/docker/texlive/Dockerfile'
      - '.github/workflows/build-ci-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ci-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if [[ -z "$tag" ]]; then
            # Content-addressed tag so an unchanged Dockerfile never republishes.
            tag="auto-$(sha256sum .github/docker/texlive/Dockerfile | cut -c1-12)"
          fi
          repo="$(echo "ghcr.io/${GITHUB_REPOSITORY}/texlive" | tr '[:upper:]' '[:lower:]')"
          echo "image=${repo}:${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${repo}:${tag}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/texlive
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report
        run: |
          {
            echo "### CI toolchain image published"
            echo ""
            echo '`${{ steps.tag.outputs.image }}`'
            echo ""
            echo "Set \`container-image\` on the reusable workflow to this exact tag."
          } >> "$GITHUB_STEP_SUMMARY"
