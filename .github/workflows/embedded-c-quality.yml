name: Embedded C Quality (C99)

# Scoped host-only validation, with no secrets or deploy permissions.
on:
  pull_request:
    paths:
      - 'src/programming/languages/c-cpp/embedded-c-quality-engineering/examples/c99/**'
      - '.github/workflows/embedded-c-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/programming/languages/c-cpp/embedded-c-quality-engineering/examples/c99/**'
      - '.github/workflows/embedded-c-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-c99:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compiler and Make versions
        run: |
          cc --version | head -n 1
          make --version | head -n 1

      - name: Strict C99 compile and host tests
        working-directory: src/programming/languages/c-cpp/embedded-c-quality-engineering/examples/c99
        run: make clean test

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version

      - name: Static analysis
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --std=c99 --error-exitcode=1 \
            src/programming/languages/c-cpp/embedded-c-quality-engineering/examples/c99
