name: _Build LaTeX (Reusable)

on:
  workflow_call:
    inputs:
      build-mode:
        description: 'Build mode: changed, full, publish, or category'
        type: string
        default: 'changed'
      category:
        description: 'Category filter for category builds'
        type: string
        default: ''
      jobs:
        description: 'Parallel job count for the canonical build layer'
        type: number
        default: 4
      base-ref:
        description: 'Base revision for changed-root builds'
        type: string
        default: ''
      head-ref:
        description: 'Head revision for changed-root builds'
        type: string
        default: ''
      upload-artifacts:
        description: 'Upload built PDFs and logs as artifacts'
        type: boolean
        default: true
      render-plantuml:
        description: 'Render PlantUML diagrams before LaTeX compilation'
        type: boolean
        default: true
      generate-jpg:
        description: 'Generate JPG files from PNG (passed to PlantUML action)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup LaTeX environment
        uses: ./.github/actions/setup-latex

      - name: Render PlantUML diagrams
        if: inputs.render-plantuml
        uses: ./.github/actions/render-plantuml
        with:
          source-dir: 'src'
          formats: 'png svg'
          generate-jpg: ${{ inputs.generate-jpg && 'true' || 'false' }}
          fail-on-error: 'true'

      - name: Build documents through the Makefile contract
        id: build-docs
        uses: ./.github/actions/build-documents
        with:
          mode: ${{ inputs.build-mode }}
          category: ${{ inputs.category }}
          jobs: ${{ inputs.jobs }}
          base-ref: ${{ inputs.base-ref }}
          head-ref: ${{ inputs.head-ref }}

      - name: Inspect generated artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          pwd
          find public -maxdepth 12 -type f 2>/dev/null | sort
          find src -type f \( -name '*.pdf' -o -name '*.build.stdout.txt' -o -name '*.build.stderr.txt' \) -print 2>/dev/null | sort
          du -ah public 2>/dev/null | sort -h | tail -50

      - name: Upload PDFs artifact
        if: ${{ always() && inputs.upload-artifacts && steps.build-docs.outputs.build-status == 'success' && steps.build-docs.outputs.has-pdfs == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: latex-pdfs
          path: public/pdfs
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs artifact
        if: ${{ always() && inputs.upload-artifacts && steps.build-docs.outputs.has-logs == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: latex-logs
          path: public/logs
          retention-days: 14
          if-no-files-found: error
