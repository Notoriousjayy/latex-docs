name: _Build LaTeX (Reusable)

# Dependency-aware, sharded LaTeX build.
#
#   plan (no TeX)  ->  build matrix (N shards)  ->  aggregate / verify
#
# The plan job is deliberately cheap: it performs root discovery, dependency
# analysis, fingerprinting and weighted shard packing without installing a TeX
# distribution, so the expensive toolchain is only provisioned on runners that
# actually compile documents.

on:
  workflow_call:
    inputs:
      build-mode:
        description: 'changed (dependency-aware selection) or full (every root)'
        type: string
        default: 'changed'
      base-ref:
        description: 'Base revision for changed-root selection'
        type: string
        default: ''
      head-ref:
        description: 'Head revision for changed-root selection'
        type: string
        default: ''
      max-shards:
        description: 'Upper bound on build shards (GitHub runner concurrency)'
        type: number
        default: 12
      max-parallel-shards:
        description: 'Maximum shards executing concurrently'
        type: number
        default: 12
      local-build-jobs:
        description: 'Concurrent latexmk processes per shard runner'
        type: number
        default: 4
      min-roots-per-shard:
        description: 'Do not create shards smaller than this (avoids setup-dominated shards)'
        type: number
        default: 25
      publish:
        description: 'Produce a complete, verified PDF corpus suitable for publication'
        type: boolean
        default: false
      render-plantuml:
        description: 'Regenerate PlantUML diagrams when diagram sources changed'
        type: boolean
        default: false
      container-image:
        description: 'Optional pinned prebuilt TeX image; empty uses apt provisioning'
        type: string
        default: ''
    outputs:
      build-status:
        description: 'success or failed'
        value: ${{ jobs.aggregate.outputs.build-status }}
      selected-roots:
        description: 'Number of roots selected for compilation'
        value: ${{ jobs.plan.outputs.selected-roots }}
      effective-mode:
        description: 'Build mode after corpus-completeness promotion'
        value: ${{ jobs.plan.outputs.effective-mode }}
      pdf-artifact:
        description: 'Name of the artifact holding the PDF corpus'
        value: ${{ jobs.aggregate.outputs.pdf-artifact }}
      raster-artifact:
        description: 'Name of the artifact holding the verified raster corpus'
        value: ${{ jobs.raster.outputs.raster-artifact }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CORPUS_CACHE_VERSION: v1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
      selected-roots: ${{ steps.plan.outputs.selected-roots }}
      total-roots: ${{ steps.plan.outputs.total-roots }}
      effective-mode: ${{ steps.plan.outputs.effective-mode }}
      plantuml-affected: ${{ steps.plantuml.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Changed-root selection needs both endpoints of the diff.
          fetch-depth: ${{ inputs.build-mode == 'full' && 1 || 0 }}

      - name: Restore published corpus manifest
        if: ${{ inputs.publish && inputs.build-mode != 'full' }}
        uses: actions/cache/restore@v6
        with:
          path: .build-cache/corpus-manifest.json
          key: corpus-manifest-${{ env.CORPUS_CACHE_VERSION }}-${{ github.sha }}
          restore-keys: |
            corpus-manifest-${{ env.CORPUS_CACHE_VERSION }}-

      - name: Restore build timing history
        uses: actions/cache/restore@v6
        with:
          path: tooling/manifests/build-timings.json
          key: latex-timings-v1-${{ github.sha }}
          restore-keys: |
            latex-timings-v1-

      - name: Determine whether PlantUML regeneration is required
        id: plantuml
        shell: bash
        run: |
          set -euo pipefail
          affected=false
          if [[ "${{ inputs.render-plantuml }}" == "true" ]]; then
            if [[ "${{ inputs.build-mode }}" == "full" ]]; then
              affected=true
            else
              base='${{ inputs.base-ref }}'
              head='${{ inputs.head-ref }}'
              if [[ -n "$base" && -n "$head" ]] \
                && git diff --name-only "$base" "$head" \
                   | grep -qE '\.(puml|iuml)$|^tooling/(styles/)?plantuml/|^tooling/manifests/plantuml\.json$|^tooling/scripts/latex_build\.py$'; then
                affected=true
              fi
            fi
          fi
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "PlantUML regeneration required: $affected"

      - name: Build plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mode='${{ inputs.build-mode }}'

          run_plan() {
            python3 tooling/scripts/latex_build.py plan \
              --mode "$1" \
              --base '${{ inputs.base-ref }}' \
              --head '${{ inputs.head-ref }}' \
              --max-shards '${{ inputs.max-shards }}' \
              --min-roots-per-shard '${{ inputs.min-roots-per-shard }}' \
              --output .build-cache/build-plan.json \
              --emit summary
          }

          run_plan "$mode"

          # Publication safety: an incremental publish is only valid when a
          # complete previous corpus exists to overlay onto. If the cached
          # corpus manifest is missing, stale or incomplete, promote to a full
          # rebuild rather than risk deploying a partial site.
          if [[ "${{ inputs.publish }}" == "true" && "$mode" != "full" ]]; then
            if ! python3 tooling/scripts/latex_build.py check-corpus-manifest \
                   --manifest .build-cache/corpus-manifest.json \
                   --plan .build-cache/build-plan.json; then
              echo "::notice::Promoting to a full rebuild to guarantee a complete published corpus."
              mode=full
              run_plan full
            fi
          fi

          echo "effective-mode=$mode" >> "$GITHUB_OUTPUT"
          python3 tooling/scripts/latex_build.py plan-outputs \
            --plan .build-cache/build-plan.json >> "$GITHUB_OUTPUT"
          python3 tooling/scripts/latex_build.py plan-outputs \
            --plan .build-cache/build-plan.json --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build plan
        uses: actions/upload-artifact@v6
        with:
          name: latex-build-plan
          path: .build-cache/build-plan.json
          retention-days: 7
          if-no-files-found: error

      - name: Lint PlantUML style framework
        shell: bash
        run: python3 tooling/scripts/plantuml_lint.py

  raster:
    name: Raster corpus
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      raster-artifact: ${{ steps.collect.outputs.raster-artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Render affected PlantUML diagrams
        if: ${{ needs.plan.outputs.plantuml-affected == 'true' }}
        uses: ./.github/actions/render-plantuml
        with:
          source-dir: 'src'
          extra-roots: ''
          formats: 'png svg'
          generate-jpg: 'true'
          # Checkout mtimes are meaningless for freshness; the plan step already
          # established that a rendering input changed.
          force: 'true'

      - name: Collect raster corpus
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/scripts/latex_build.py collect-raster \
            --source-dir src \
            --output-dir .build-cache/raster-corpus \
            --manifest .build-cache/raster-manifest.json \
            --require-nonempty
          echo "raster-artifact=latex-raster" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          manifest = json.loads(Path('.build-cache/raster-manifest.json').read_text(encoding='utf-8'))
          counts = manifest['counts']
          print(f"Raster corpus: {manifest['total']} files ({counts['png']} PNG, {counts['jpg']} JPG, {counts['jpeg']} JPEG)")
          PY

      - name: Upload raster corpus
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.collect.outputs.raster-artifact }}
          path: .build-cache/raster-corpus
          retention-days: 14
          if-no-files-found: error
          # upload-artifact excludes hidden basenames by default, including the
          # search root itself; keep only the ancestor hidden.
          compression-level: 0

  build:
    name: ${{ matrix.shard.name }}
    needs: [plan, raster]
    if: ${{ fromJSON(needs.plan.outputs.shard-count) > 0 && needs.raster.outputs.raster-artifact != '' }}
    runs-on: ubuntu-latest
    # fromJSON('null') yields a true null so the container key is omitted
    # entirely when no pinned image is configured.
    container: ${{ inputs.container-image != '' && fromJSON(format('{{"image":"{0}"}}', inputs.container-image)) || fromJSON('null') }}
    strategy:
      # Every shard must report its own failures; a single broken document must
      # not mask the status of the remaining corpus.
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel-shards }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup LaTeX environment
        uses: ./.github/actions/setup-latex
        with:
          skip-install: ${{ inputs.container-image != '' && 'true' || 'false' }}

      - name: Download build plan
        uses: actions/download-artifact@v7
        with:
          name: latex-build-plan
          path: .build-cache

      - name: Download verified raster corpus
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.raster.outputs.raster-artifact }}
          path: .

      - name: Build shard
        id: build
        uses: ./.github/actions/build-documents
        with:
          mode: shard
          plan: .build-cache/build-plan.json
          shard-index: ${{ matrix.shard.index }}
          jobs: ${{ inputs.local-build-jobs }}

      - name: Upload shard PDFs
        if: ${{ always() && steps.build.outputs.has-pdfs == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: latex-shard-pdfs-${{ matrix.shard.index }}
          path: public/pdfs
          retention-days: 3
          if-no-files-found: error
          # PDFs are already compressed; re-deflating thousands of them is pure
          # CPU cost on both upload and download.
          compression-level: 0

      - name: Upload shard diagnostics
        if: ${{ always() && steps.build.outputs.has-logs == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: latex-shard-logs-${{ matrix.shard.index }}
          path: public/logs
          retention-days: 7
          if-no-files-found: ignore

  aggregate:
    name: Aggregate
    needs: [plan, raster, build]
    if: ${{ always() && needs.plan.result == 'success' && needs.raster.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{ steps.verify.outputs.build-status }}
      pdf-artifact: ${{ steps.verify.outputs.pdf-artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build plan
        uses: actions/download-artifact@v7
        with:
          name: latex-build-plan
          path: .build-cache

      - name: Restore previously published PDF corpus
        if: ${{ inputs.publish && needs.plan.outputs.effective-mode != 'full' }}
        uses: actions/cache/restore@v6
        with:
          path: public/pdfs
          key: corpus-pdfs-${{ env.CORPUS_CACHE_VERSION }}-${{ github.sha }}
          restore-keys: |
            corpus-pdfs-${{ env.CORPUS_CACHE_VERSION }}-

      - name: Download shard PDFs
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: latex-shard-pdfs-*
          path: .shard-pdfs
          merge-multiple: true

      - name: Download shard diagnostics
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: latex-shard-logs-*
          path: .shard-logs

      - name: Overlay shard output onto the corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/pdfs
          if [[ -d .shard-pdfs ]]; then
            cp -a .shard-pdfs/. public/pdfs/
          fi

      - name: Verify corpus and summarise
        id: verify
        shell: bash
        run: |
          set -uo pipefail
          python3 tooling/scripts/latex_build.py aggregate-shards \
            --plan .build-cache/build-plan.json \
            --logs .shard-logs \
            --pdf-dir public/pdfs \
            --output public/logs \
            --manifest .build-cache/corpus-manifest.json \
            --shard-result '${{ needs.build.result }}' \
            --require-complete-corpus '${{ inputs.publish }}'
          aggregate_status=$?

          status=success
          if [[ "$aggregate_status" -ne 0 ]]; then
            status=failed
          fi

          {
            echo "build-status=$status"
            echo "pdf-artifact=latex-pdfs"
          } >> "$GITHUB_OUTPUT"

          cat public/logs/build-report.md >> "$GITHUB_STEP_SUMMARY"

          [[ "$status" == "success" ]]

      - name: Merge shard timings into history
        if: ${{ always() }}
        shell: bash
        run: python3 tooling/scripts/latex_build.py merge-timings .shard-logs

      - name: Save build timing history
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: tooling/manifests/build-timings.json
          key: latex-timings-v1-${{ github.sha }}

      - name: Save published PDF corpus
        if: ${{ inputs.publish && steps.verify.outputs.build-status == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: public/pdfs
          key: corpus-pdfs-${{ env.CORPUS_CACHE_VERSION }}-${{ github.sha }}

      - name: Save published corpus manifest
        if: ${{ inputs.publish && steps.verify.outputs.build-status == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: .build-cache/corpus-manifest.json
          key: corpus-manifest-${{ env.CORPUS_CACHE_VERSION }}-${{ github.sha }}

      - name: Upload PDF corpus
        if: ${{ steps.verify.outputs.build-status == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: latex-pdfs
          path: public/pdfs
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Upload build report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: latex-build-report
          path: public/logs
          retention-days: 14
          if-no-files-found: ignore
