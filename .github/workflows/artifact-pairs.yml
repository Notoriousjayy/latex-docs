name: Reusable Artifact Pairs

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tooling/manifests/reusable-artifact-pairs.json'
      - 'tooling/scripts/validate_artifact_pairs.py'
      - 'tests/test_reusable_artifact_pairs.py'
      - '.github/workflows/artifact-pairs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifest and pairing rules
        run: python3 tooling/scripts/validate_artifact_pairs.py
      - name: Pairing regression tests
        run: python3 -m unittest discover -s tests -p 'test_reusable_artifact_pairs.py'
