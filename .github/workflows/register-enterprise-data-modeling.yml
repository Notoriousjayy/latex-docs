name: Register Enterprise Data Modeling Suite in Canonical Catalogs
on:
  push:
    branches:
      - docs/enterprise-data-modeling-suite-20261030
    paths:
      - .github/transfer/governance-ready.txt
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Register source inventory and Template-Blank pairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path.cwd()
          suite=root/'src/data-systems/enterprise-data-modeling'
          pair_path=root/'tooling/manifests/reusable-artifact-pairs.json'
          pairs=json.loads(pair_path.read_text(encoding='utf-8'))
          existing={entry['blank'] for entry in pairs['pairs']}
          for blank in sorted(suite.rglob('*-blank.tex')):
              rel=blank.relative_to(root).as_posix()
              template=blank.with_name(blank.name.replace('-blank.tex','-template.tex'))
              assert template.is_file(), f'Missing Template for {rel}'
              if rel in existing:
                  continue
              stem=blank.stem.removesuffix('-blank')
              ident='DATA-EDM-'+blank.parent.name.upper()+'-'+stem.upper().replace('-','_')
              pairs['pairs'].append({
                  'id':ident,
                  'domain':'data-systems',
                  'family':'enterprise-data-modeling-workbook' if blank.parent.name=='workbooks' else 'enterprise-data-modeling-form',
                  'template':template.relative_to(root).as_posix(),
                  'blank':rel,
                  'status':'COMPLETE_PAIR',
              })
              existing.add(rel)
          assert len([p for p in pairs['pairs'] if p['blank'].startswith('src/data-systems/enterprise-data-modeling/')])==14
          pairs['pairs'].sort(key=lambda p:p['id'])
          pair_path.write_text(json.dumps(pairs,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          inventory_path=root/'tooling/manifests/semantic-document-inventory.json'
          inventory=json.loads(inventory_path.read_text(encoding='utf-8'))
          known={entry['path'] for entry in inventory['sources']}
          blank_paths={entry['blank'] for entry in pairs['pairs']}
          type_by_dir={
              'case-studies':'laboratory',
              'curriculum':'study-guide',
              'governance':'policy-standard',
              'laboratories':'laboratory',
              'references':'technical-reference',
              'scorecards':'scorecard',
              'study-guides':'study-guide',
              'templates':'template',
              'workbooks':'workbook',
          }
          new=0
          for tex in sorted(suite.rglob('*.tex')):
              rel=tex.relative_to(root).as_posix()
              if rel in known or rel in blank_paths:
                  continue
              raw=tex.read_bytes()
              typ=type_by_dir[tex.parent.name]
              entry={
                  'id':'DATA-EDM-'+rel[len('src/data-systems/enterprise-data-modeling/'):].removesuffix('.tex').upper().replace('/','-').replace('-','_'),
                  'path':rel,
                  'title':tex.stem.replace('-',' ').title(),
                  'domain':'data-systems',
                  'primary_subject':'enterprise-data-modeling',
                  'primary_type':typ,
                  'secondary_types':[],
                  'review_status':'path-inferred-not-fully-reviewed',
                  'summary':None,
                  'standalone_latex':b'\\documentclass' in raw,
                  'blob_sha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest(),
              }
              inventory['sources'].append(entry)
              known.add(rel)
              new+=1
          assert new==62, f'expected 62 canonical new roots, got {new}'
          inventory['sources'].sort(key=lambda entry:entry['path'])
          inventory['document_count']=len(inventory['sources'])
          inventory_path.write_text(json.dumps(inventory,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'Registered 14 paired Blanks and {new} canonical LaTeX roots')
          PY
          python3 tooling/scripts/validate_artifact_pairs.py
          python3 tooling/scripts/semantic_content_audit.py --check
          python3 tooling/scripts/build_semantic_catalogs.py --write
          python3 tooling/scripts/build_semantic_catalogs.py --check
          python3 - <<'PY'
          from pathlib import Path
          root=Path('src/devops/ci-cd/continuous-delivery-release-engineering/diagrams')
          for ext, description in [('png','PNG raster exports'),('svg','SVG vector exports')]:
              d=root/ext
              assert d.is_dir()
              index=d/'README.md'
              if not index.exists():
                  lines=['# '+description+'','Generated visual assets corresponding to PlantUML sources in the [diagram index](../README.md).','','## Files','']
                  lines.extend('- '+p.name for p in sorted(d.glob('*.'+ext)))
                  lines.extend(['','## Maintenance','','These files are generated presentation artifacts. Update the authoritative .puml files in the parent directory before regenerating exports.',''])
                  index.write_text('\\n'.join(lines),encoding='utf-8')
          PY
          python3 -m unittest -v tests.test_semantic_taxonomy tests.test_domain_document_type_layout tests.test_src_information_architecture
          python3 src/data-systems/enterprise-data-modeling/scripts/verify_suite.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/manifests/semantic-document-inventory.json tooling/manifests/reusable-artifact-pairs.json catalog src/devops/ci-cd/continuous-delivery-release-engineering/diagrams/png/README.md src/devops/ci-cd/continuous-delivery-release-engineering/diagrams/svg/README.md
          git rm -f .github/transfer/governance-ready.txt
          git diff --cached --quiet || git commit -m 'docs(data-systems): register enterprise suite artifacts and refresh catalogs'
          git push origin HEAD:docs/enterprise-data-modeling-suite-20261030
