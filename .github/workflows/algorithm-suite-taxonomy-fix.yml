name: Align Algorithm Engineering semantic types (one-time)
on:
  push:
    branches:
      - docs/algorithm-engineering-suite-20261029
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use repository-approved semantic types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tooling/manifests/semantic-document-inventory.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          count=0
          for e in data['sources']:
              if e['path'].startswith('src/programming/algorithms/algorithm-engineering/curricula/') and e['primary_type']=='curriculum':
                  e['primary_type']='study-guide'
                  count+=1
              elif e['path'].startswith('src/programming/algorithms/algorithm-engineering/procedures/') and e['primary_type']=='procedure':
                  e['primary_type']='runbook'
                  count+=1
          assert count==4,count
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 tooling/scripts/build_semantic_catalogs.py --write
          python3 tooling/scripts/semantic_content_audit.py --check
          python3 tooling/scripts/build_semantic_catalogs.py --check
          python3 -m unittest -v tests.test_semantic_taxonomy
      - name: Commit corrected taxonomy and retire temporary action
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/algorithm-suite-taxonomy-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/manifests/semantic-document-inventory.json catalog/
          git add -u .github/workflows/algorithm-suite-taxonomy-fix.yml
          git diff --cached --check
          git commit -m 'fix(catalog): classify algorithm curricula and procedures with supported types'
          git push origin HEAD:docs/algorithm-engineering-suite-20261029
